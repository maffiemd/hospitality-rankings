      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 22 of 26 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: SooCheong (Shawn) Jang (24689 citations, 306 works); Xinran Lehto (11875 citations, 221 works); Kevin Kam Fung So (9894 citations, 138 works); Jiyun Kang (3011 citations, 91 works); Rodney Runyan (2618 citations, 68 works).
