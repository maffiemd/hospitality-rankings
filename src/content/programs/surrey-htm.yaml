costOfAttendance:
  totalCost:
    value: 43611
    unit: USD/year
    source:
      label: "International Hospitality Management — Fees"
      url: https://www.surrey.ac.uk/undergraduate/international-hospitality-management
      publisher: University of Surrey
      asOfDate: "2027-09-01"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      Composite, not a single published total. Tuition: Surrey's own course page's fees section no
      longer shows a 2026/27 figure at all — the only figure live on the page is "Fees for the
      2027-28 academic year": £23,800/year international/overseas (Surrey's general fee-schedule
      pages for 2026 entry have likewise already been superseded by 2027-entry pages, with no 2026/27
      figure found anywhere on the live site). Living costs: no official university page gives a
      specific living-cost total — Surrey's own budgeting page just points to "the minimum funding
      required" for the student visa without stating it — so this uses the UK Home Office's own
      Student visa minimum maintenance/funding figure directly from
      https://www.gov.uk/student-visa/money (read 2026-11-03): £1,171/month for up to 9 months
      outside London (Guildford counts as outside London), i.e. £10,539/year. That figure is a
      regulatory minimum for visa approval, not an estimate of typical/average living costs, so this
      total likely understates real cost of attendance. £23,800 + £10,539 = £34,339, converted to
      USD at an approximate rate of £1 = $1.27 (as of 2026) ≈ $43,611. Because the tuition figure is
      explicitly for 2027-28 entry (one year ahead of this file's other 2026/27-dated figures), treat
      this value as a near-term estimate rather than this year's actual rate.
