      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 32 of 34 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Karen Kelly (21066 citations, 659 works); Iis Tussyadiah (14364 citations, 172 works); Gang Li (10512 citations, 305 works); Xavier Font (10231 citations, 198 works); Mark Ashton (8678 citations, 215 works).
