  satActEquivalent:
    value: 76.5
    unit: "percentile, national test-taking cohort (SAT Nationally Representative table, College Board)"
    source:
      label: "Florida International University admission profile (2024-25 cycle)"
      url: https://www.collegetuitioncompare.com/edu/133951/florida-international-university/admission/
      publisher: "CollegeTuitionCompare (secondary aggregator of FIU Common Data Set)"
      asOfDate: "2024-12-11"
    lastVerified: "2026-10-26"
    confidence: low
    notes: Raw SAT composite was the midpoint of the university-wide SAT middle-50% range (1070-1260) for the 2024-25 cycle; not program-specific. Converted to a percentile via the College Board's official "SAT Nationally Representative Percentiles" table; the table lists 1160 at the 76th percentile and 1170 at the 77th, linearly interpolated to 76.5 for a composite of 1165 — see methodology for why this project uses a common percentile scale across all programs.

academicResearch:
  facultyPubCitationIndex:
    value: 13609
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-11-02"
    lastVerified: "2026-11-02"
    confidence: low
    notes: >-
      Sum of career cited_by_count across 18 of 98 names on the Chaplin School's current faculty
      directory page (hospitality.fiu.edu/faculty) matched to an OpenAlex author record by name +
      institution — covers ALL of each person's publications (any journal/field), not just
      hospitality-tagged ones, and their full career (not a fixed year window). Unmatched names are
      excluded from the sum, not counted as zero; 2 of 98 (Ivonne Yee, Jinlin Zhao) could not be
      queried due to OpenAlex API rate limiting during this pass, not a confirmed non-match. Top
      contributors: Imran Nazir Ahmad (4177 citations, 254 works); Sandro Formica (2288 citations, 23
      works); Barry H. Gump (1761 citations, 170 works); Lisa Cain (1426 citations, 95 works); Robert
      H. Bosselman (1312 citations, 74 works). SUPERSEDES the previous partial pass (7 of 32 matched,
      7566 total) which used a since-unreachable "32 current named faculty" subset — the school's
      directory page now lists ~98 names and does not separate full-time academic faculty from
      adjunct instructors or industry executives-in-residence, so this denominator is broader in
      composition than the prior "32," not a clean continuation of it. Flagged low confidence pending
      a pass that can isolate full-time research faculty specifically.
  researchFundingUSD:
    value: 306434000
    unit: USD/year
    source:
      label: "Table 21: Higher education R&D expenditures, ranked by FY 2023 R&D expenditures (FYs 2010-23) — Higher Education Research and Development (HERD) Survey, Fiscal Year 2023 (NSF 25-314)"
      url: https://ncses.nsf.gov/pubs/nsf25314/assets/data-tables/tables/nsf25314-tab021.pdf
      publisher: National Center for Science and Engineering Statistics (NCSES), National Science Foundation
      asOfDate: "2023-06-30"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      University-wide total R&D expenditures for FY2023 (all fields, all funding sources,
      institution-wide — not Chaplin-School-specific; the HERD survey does not break out R&D
      spending by individual school or department), per NSF's official HERD Survey Table 21 (ranked
      by FY2023 total R&D expenditures). FIU ranked 104th of 664 surveyed institutions nationally,
      with $306,434 thousand in FY2023 R&D expenditures (up from $281,665 thousand in FY2022).
  hasPhDProgram:
    value: 0
    unit: boolean (1=yes, 0=no)
    source:
      label: "FIU Business adds a hospitality concentration to the doctoral program"
      url: https://business.fiu.edu/news/2024/fiu-business-adds-a-hospitality-concentration-to-the-doctoral-program.html
      publisher: FIU Business
      asOfDate: "2024-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      The Chaplin School does not itself grant a PhD. FIU Business launched a hospitality concentration
      within its Doctorate in Business Administration (DBA), enrolling its first cohort in Spring 2025.
      A DBA is a practitioner-oriented professional doctorate rather than a traditional research PhD, so
      this is recorded as 0 pending a dedicated research-PhD offering.

