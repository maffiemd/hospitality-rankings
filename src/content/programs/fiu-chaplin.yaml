outcomes:
  startingSalary:
    value: 63921
    unit: USD/year
    source:
      label: "Career Development Office — Chaplin School Career Statistics"
      url: https://hospitality.fiu.edu/career/
      publisher: "FIU Chaplin School of Hospitality & Tourism Management (salary data via Steppingblocks.com)"
      asOfDate: "2026-09-18"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      Chaplin School's own Career Development page cites a $63,921 average starting salary for
      Bachelor's graduates (and $68,828 separately for Master's graduates), sourced to Steppingblocks.com
      and covering a rolling 2020-2026 multi-year window rather than a single graduating class. No
      FIU-produced outcomes report with an exact single-class-year figure was found for v1.
  employmentRate:
    unit: "%"
    confidence: low
    notes: >
      No disclosed employment-rate or offer-acceptance percentage was found on the Chaplin School's
      Career Development page or elsewhere for v1; the page reports counts (250+ employers visiting,
      500+ internship positions filled) rather than a rate. Re-checked 2026-11-03: also checked
      hospitality.fiu.edu/career/employers (counts only — "nearly 200 students" per career fair, no
      rate) and the Dean's 2025 Year in Review page (hospitality.fiu.edu/about/deans-2025-year-in-review/,
      which gives a 75.4% AY21-22 figure but that is a graduation rate, not employment), plus a search
      for an FIU-wide Career and Talent Development / First Destination Survey result — none found
      publicly. Still unsourced for v1.
  recruiterReputationScore:
    value: 55.1
    unit: "0-100"
    source:
      label: "QS World University Rankings by Subject 2026 — Hospitality & Leisure Management, Employer Reputation indicator"
      url: https://www.topuniversities.com/university-subject-rankings/hospitality-leisure-management
      publisher: QS Quacquarelli Symonds
      asOfDate: "2026-03-25"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: QS's Employer Reputation indicator score (not the composite subject rank) for the 2026 Hospitality & Leisure Management subject table, where FIU ranked =No. 23 worldwide (overall score 58.3).
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >
      The Chaplin School cites "500+ internship positions filled by students" — a count, not a
      percentage/rate — so no internship-placement-rate figure is recorded for v1. Re-checked
      2026-11-03 on hospitality.fiu.edu/career/ and hospitality.fiu.edu/career/employers — same
      counts-only pattern, still no stated percentage.

