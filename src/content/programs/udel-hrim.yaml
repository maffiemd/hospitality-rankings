      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 12 of 15 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Matthew Robinson (5207 citations, 105 works); Markus Schuckert (4324 citations, 129 works); Zvi Schwartz (3455 citations, 104 works); Srikanth Beldona (2470 citations, 68 works); Sheryl F. Kline (1592 citations, 50 works).
