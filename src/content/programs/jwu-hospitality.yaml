outcomes:
  startingSalary:
    value: 55790
    unit: USD/year
    source:
      label: "Gainful Employment earnings-test data, CIP 52.09 Hospitality Administration/Management, Bachelor's (institution-level extract)"
      url: https://www.theheagroup.com/blog/earnings-test-data
      publisher: "The HEA Group, from U.S. Department of Education Gainful Employment (OBBBA) earnings-test data"
      asOfDate: "2024-01-01"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      Not a starting-salary figure like most other schools in this dataset — this is median earnings
      four years after completion for the Johnson & Wales University-Providence Hospitality
      Administration/Management bachelor's completers (pooled 2017-18/2018-19 completer cohorts,
      earnings measured in CY2022-CY2023, inflation-adjusted to 2024 dollars), from the federal
      Gainful Employment earnings test, via The HEA Group's compiled extract. Used here because no
      JWU-specific or College-of-Hospitality-Management-specific starting-salary figure was otherwise
      found (JWU's public Career Outcomes reporting discloses only an outcomes rate, not a salary) —
      treat as a different metric vintage/definition than schools with a self-reported starting-salary
      figure, not a directly comparable number. Figure is for the Providence campus, where this
      program's Hospitality Administration/Management CIP code is reported; JWU's College of
      Hospitality Management is administered from Providence.
  employmentRate:
    value: 92.3
    unit: "%"
    source:
      label: "Career Outcomes — Providence Campus"
      url: https://www.jwu.edu/career-outcomes/index.html
      publisher: Johnson & Wales University
      asOfDate: "2024-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      University-wide (Providence campus) undergraduate Career Outcomes Rate for the Class of 2023-24,
      based on a 69.9% knowledge rate; measures graduates employed, continuing education, performing
      voluntary service, or enlisted in the military within six months of graduation — not a pure
      employment rate. Separately, legacy program pages for the Hotel & Resort Management and Tourism &
      Hospitality Management B.S. majors — both folded into a single Hospitality Management B.S. starting
      Fall 2023 — cite a higher 96.8% career-outcomes rate specific to those majors. That figure's exact
      vintage could not be confirmed and the program structure has since changed, so it is noted here as
      a discrepancy rather than used as the primary value.
  recruiterReputationScore:
    unit: "0-100"
    confidence: low
    notes: >-
      Confirmed via a real browser session 2026-11-03 (the live QS page returns HTTP 403 to automated
      fetch, so this needed a human-equivalent browser check): paged through all 173 ranked
      institutions in the QS World University Rankings by Subject 2026, Hospitality & Leisure
      Management table (topuniversities.com/university-subject-rankings/hospitality-leisure-management)
      end to end. Johnson & Wales University does not appear anywhere in the table — this is now a
      confirmed absence, not a blocked-source gap. Left blank; there is no Employer Reputation score to
      record.
  internshipPlacementRate:
    value: 86
    unit: "%"
    source:
      label: "Career Outcomes — \"of students complete an internship\""
      url: https://www.jwu.edu/academics/experiential-education/career-outcomes/
      publisher: Johnson & Wales University
      asOfDate: "2026-11-03"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      Confirmed via a real browser session 2026-11-03: this page is JS-rendered and returns empty
      content to automated fetch (as does hospitality.jwu.edu, which fails with a repeated SSL
      handshake error), but loads normally in a real browser. States "86% of students complete an
      internship" and separately "96.2% of employers rate JWU's internship program as good or
      exceptional" — no academic year or cohort is given on the page. This is a university-wide figure,
      not broken out for the College of Hospitality & Business specifically — same caveat as this
      file's facultyStudentRatio and other university-wide entries. The Hospitality Management B.S.
      program page itself (jwu.edu/academics/programs/hospitality-management-bs/) confirms the program
      requires 600 hours of Work Integrated Learning (3-year track) or a 6-credit internship (4-year
      track), but discloses no program-specific completion/placement percentage. Used the university-wide
      figure as the best available proxy rather than leaving this blank, flagged low confidence for both
      the scope mismatch and the missing cohort/year.

