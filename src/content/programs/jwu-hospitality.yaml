    source:
      label: "Career Outcomes — Providence Campus"
      url: https://www.jwu.edu/career-outcomes/index.html
      publisher: Johnson & Wales University
      asOfDate: "2024-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      University-wide (Providence campus) undergraduate Career Outcomes Rate for the Class of 2023-24,
      based on a 69.9% knowledge rate; measures graduates employed, continuing education, performing
      voluntary service, or enlisted in the military within six months of graduation — not a pure
      employment rate. Separately, legacy program pages for the Hotel & Resort Management and Tourism &
      Hospitality Management B.S. majors — both folded into a single Hospitality Management B.S. starting
      Fall 2023 — cite a higher 96.8% career-outcomes rate specific to those majors. That figure's exact
      vintage could not be confirmed and the program structure has since changed, so it is noted here as
      a discrepancy rather than used as the primary value.
