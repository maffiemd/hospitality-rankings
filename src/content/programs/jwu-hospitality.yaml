academicResearch:
  facultyPubCitationIndex:
    value: 975
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-11-03"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      Sum of career cited_by_count across 6 of 21 current named faculty matched to an OpenAlex author
      record by name + institution. Faculty roster is JWU's own official academic-catalog directory
      for the Providence campus (catalog.jwu.edu/aboutjwu/academicdirectories/hospitality-business/providence/providence.pdf,
      generated 2026-03-04) — note the college's current catalog name is "College of Hospitality &
      Business," not "College of Hospitality Management"; the directory's 21-person "Faculty" section
      is used as the denominator (matching this entry's prior unresolved "21 current named faculty"
      estimate), excluding the separately-listed dean/associate deans/program directors. Covers ALL of
      each matched person's publications (any journal/field), not just hospitality-tagged ones, and
      their full career. Unmatched names (15 of 21) are excluded from the sum, not counted as zero.
      One apparent match was found and deliberately EXCLUDED as a false positive: an OpenAlex author
      named "Nicholas Makris" has 2,853 citations and a one-year (2025) Johnson & Wales affiliation
      record, but his last-known institution is MIT and his entire publication record is underwater/
      ocean acoustics — this is clearly the same-named MIT/Northeastern acoustics professor Nicholas C.
      Makris, not JWU's own hospitality faculty member "Nicholas Makris, DBA," so he was excluded
      rather than counted (verified via his OpenAlex topics and institution history). Genuine matched
      contributors: Isaac Sakyi Damoah (933 citations, 33 works — consistent with his stated Ph.D. from
      Liverpool John Moores University per the directory); Paul J. Bagdan (25 citations, 4 works);
      Nihar Kumthekar (17 citations, 15 works); Anthony R. Fruzzetti (0 citations, 4 works); Mansour
      Moussavi (0 citations, 1 work, tourism-education topic); John D. Varlaro (0 citations, 4 works).
      Flagged low confidence given the small matched fraction (6 of 21) and the one confirmed
      false-positive exclusion.
  researchFundingUSD:
    unit: USD/year
    confidence: low
    notes: >-
      Checked NSF's Higher Education Research and Development (HERD) Survey FY2023, Table 21 (ranked
      by FY2023 R&D expenditures, all 664 surveyed institutions nationally —
      https://ncses.nsf.gov/pubs/nsf25314/assets/data-tables/tables/nsf25314-tab021.pdf). Johnson &
      Wales University does not appear anywhere in this table (confirmed via full-text search of all
      24 pages), unlike FIU, UDel, and UH which do appear. HERD surveys institutions that reported
      more than $150,000 in separately accounted-for R&D in the fiscal year; JWU's absence most likely
      reflects falling under that threshold or not being part of the survey's eligible population
      (consistent with JWU being a teaching-focused institution without a traditional research PhD —
      see hasPhDProgram note below) rather than a data-retrieval failure. Left unsourced for v1 rather
      than substituting a different, non-university-wide figure.
  hasPhDProgram:
    value: 0
    unit: boolean (1=yes, 0=no)
    source:
      label: "Johnson & Wales University to Offer Two, New Online-Only Doctoral Programs"
      url: https://www.jwu.edu/news/university-press-releases/providence/doctoral-programs.html
      publisher: Johnson & Wales University
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      JWU offers a Doctor of Business Administration (DBA) with a Hospitality Leadership concentration
      (alongside an Ed.D. and applied clinical doctorates), delivered fully online in a cohort model, but
      no traditional research PhD. Recorded as 0 since a DBA is a practitioner-oriented professional
      doctorate rather than a PhD.

