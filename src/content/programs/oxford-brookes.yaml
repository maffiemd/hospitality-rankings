costOfAttendance:
  totalCost:
    value: 35737
    unit: USD/year
    source:
      label: "International Hospitality and Tourism Management — Fees"
      url: https://brookes.ac.uk/courses/undergraduate/international-hospitality-and-tourism-management
      publisher: Oxford Brookes University
      asOfDate: "2026-09-01"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      Composite, not a single published total. Tuition: Oxford Brookes's own course page states the
      international/overseas fee for 2026/27 as £17,600/year (rising to £18,500 for 2027/28; the page
      warns fees may increase for continuing international students too). Living costs: no official
      university page gives a specific living-cost total, so this uses the UK Home Office's own
      Student visa minimum maintenance/funding figure — £1,171/month for up to 9 months outside
      London (Oxford counts as outside London for this purpose), i.e. £10,539/year, read directly
      from https://www.gov.uk/student-visa/money on 2026-11-03. That figure is a regulatory minimum
      for visa approval, not an estimate of typical/average living costs, so this total likely
      understates real cost of attendance. £17,600 + £10,539 = £28,139, converted to USD at an
      approximate rate of £1 = $1.27 (as of 2026) ≈ $35,737.
