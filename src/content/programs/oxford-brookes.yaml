academicQuality:
  sixYearGraduationRate:
    value: 92
    unit: "%"
    source:
      label: "Student outcomes data dashboard — Completion outcomes by mode and level of study, Office for Students (OfS) B3 Outcomes measure"
      url: https://www.officeforstudents.org.uk/data-and-analysis/student-outcomes-data-dashboard/data-dashboard/
      publisher: Office for Students (OfS)
      asOfDate: "2026-08-06"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Retrieved via a real browser session 2026-11-03 — this is an embedded Tableau dashboard with no
      data readable by automated fetch, so it needed a human-equivalent browser check. Full-time,
      First degree completion indicator for Oxford Brookes University, 2016-17 to 2019-20 entrant
      cohort (n=14,220): 92% (numerical threshold 75%). This is the genuine UK equivalent of IPEDS's
      150%-of-normal-time completion rate — the OfS's own B3 Outcomes "completion" measure, projecting
      completion over an extended window — rather than the 1-year continuation measure already used
      for this file's retentionRate entry. Dashboard "last updated" date used as asOfDate since the
      measure itself spans a multi-year cohort window rather than a single as-of date.
  retentionRate:
    value: 90
    unit: "%"
    source:
      label: "BSc (Hons) International Hospitality and Tourism Management — course data"
      url: https://www.discoveruni.gov.uk/course-details/10004930/BSCH-HM/FullTime/
      publisher: Discover Uni (Office for Students / HESA)
      asOfDate: "2025-01-01"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      Discover Uni's "After 1 year on the course" continuation measure: 90% of students were still
      on the course or had completed it (85% still studying + 5% completed), for the pooled 2022-24
      entrant cohort (n=45) — Discover Uni pools two entry years for this course because of its small
