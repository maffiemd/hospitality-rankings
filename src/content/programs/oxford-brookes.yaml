outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: "Discover Uni (UK official source, using HESA Longitudinal Education Outcomes / LEO data) publishes only 3-year and 5-year post-graduation earnings for this specific course — £26,500 after 3 years and £33,000 after 5 years, both from the 2016-18 graduating cohort (n=70) — not a 15-month \"starting salary\" figure. The 15-month earnings/outcomes split is explicitly suppressed on Discover Uni for this course (\"there is no data available for this course,\" attributed to small cohort/response size). Left blank rather than substituting the 3-year figure as a stand-in for starting salary."
  employmentRate:
    unit: "%"
    confidence: low
    notes: Discover Uni shows no published Graduate Outcomes (15 months after course) data for this specific course, citing small course size / insufficient survey responses. A broader "Business and management" subject aggregate for Oxford Brookes reports about 87% in work/study after 15 months, but that figure is not specific to this hospitality program, so it was not used here. Left blank.
  recruiterReputationScore:
