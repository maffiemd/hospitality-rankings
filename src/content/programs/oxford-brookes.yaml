  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: The course offers an optional (not mandatory) supervised year-long work placement in year 3 of the 4-year route, with past placements at employers such as Marriott, Four Seasons, and The Savoy. No placement-rate percentage is published. Left blank.
  requiredInternshipHours:
    unit: hours
    confidence: low
    notes: >-
      The course's year-long work placement (optional, year 3 of the 4-year route) has no course-specific
      hour or week figure stated anywhere checked (the course page, its module listing, or the
      Hospitality/Tourism subject-area work-experience page). A 40-week minimum exists but only as a
      generic Business School/subject-area-wide figure, not tied by name to this course or its THEM5005
      placement module, so per this project's no-fabrication policy it is not entered here. Left blank
      rather than assuming the generic figure applies, or converting "year-long" to an hours estimate
      without a stated weekly-hours basis.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed per-course by Oxford Brookes or UCAS; UK universities generally do not publish programme-level acceptance rates. Left blank.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: Oxford Brookes uses the UK UCAS Tariff system, not SAT/ACT. The standard offer for this course is 112 UCAS Tariff Points (BBC at A-Level, 27 IB points, or DMM at BTEC), plus GCSE Maths and English at grade 4+, per the official course page. This project converts other systems' admission scores to a percentile of the national cohort where an official source for that conversion exists (SAT via the College Board, ATAR by definition); no equivalent official percentile distribution of UCAS Tariff points among accepted applicants was found (UCAS's End of Cycle reports publish acceptances by institution tariff tier, not a population percentile by Tariff-point score). Left blank rather than estimating one; see methodology.

academicResearch:
  facultyPubCitationIndex:
    value: 12389
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-11-03"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Fresh attempt. Faculty list sourced from Oxford Brookes Business School's own staff directory
      pages (https://www.brookes.ac.uk/business/about/staff/ and
      https://www.brookes.ac.uk/business/research/staff/), filtered to the 11 names whose listed role
      names hospitality, tourism, or events. Matched 10 of 11 to an OpenAlex author record by name +
      institution (Oxford Brookes University, OpenAlex institution id I124261462), summing career
      cited_by_count across ALL of each person's publications (any field, full career, not a fixed
      year window) — same methodology this file's Surrey counterpart uses. The one unmatched name
      (Gordon Yan) is excluded from the sum, not counted as zero. Top contributors: Peter Lugosi
      (3,684 citations, 120 works); Hugues Séraphin (2,668 citations, 198 works); Julian Kwabena Ayeh
      (2,225 citations, 32 works); Zaid Alrawadieh (1,795 citations, 58 works); Rosa Codina (1,221
      citations, 69 works); Grzegorz "Greg" Kapuściński (407 citations, 12 works); Giulia Rossetti
      (186 citations, 27 works); Nathan Zhang (72 citations, 4 works); Kate Mingjie Ji (88 citations,
      26 works); Claudia Macaveiu (43 citations, 8 works). Replaces the prior low-confidence value of
      0 (logged 2026-10-22, also against all 11 current faculty, zero confident matches) — this
      attempt's higher match rate querying OpenAlex's API directly by name + Oxford Brookes
      institution filter. The cause of that discrepancy (different query method, a transient API
      issue, or a difference in exactly which 11 names were queried) was not independently diagnosed.
