    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      jcu.edu.au and the Dept of Education's research-block-grants PDF both block automated fetch,
      but the underlying dataset turned out to be a separate, small (1.62MB) XLSX file rather than
      the giant PDF that had been timing out; downloaded directly and parsed 2026-11-03. University-
      wide total R&D income for 2024 (all four HERDC categories — Australian Competitive Grants +
      other Public Sector Research Funding + Industry and other Funding + Cooperative Research Centre
      Funding summed): AUD 62,071,843, converted to USD at an approximate rate of 0.65 USD/AUD
      (consistent with this file's totalCost figure) = ~US$40,346,698. Not broken out for the tourism/
      hospitality/events program specifically. Three-year trend from the same dataset, for context:
      AUD 41.8m (2021) -> 53.9m (2022) -> 59.0m (2023) -> 62.1m (2024), a steady upward trend —
      roughly consistent with (though not identical to) the previously-unverified undated job-board
      figure of "$67.4 million total research income" logged here earlier, which is now superseded.
      futurecampus.com.au's 2025 Queensland-universities financial roundup (JCU total income ~AUD
      725m, Commonwealth grants ~AUD 233.8m) remains unused since it isn't research-income-specific.
