admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed. Australian undergraduate admission operates on a minimum ATAR/rank threshold rather than a US-style applicant-to-admit acceptance rate.
  satActEquivalent:
    value: 59.4
    unit: "percentile, national test-taking cohort (ATAR, Australia)"
    source:
      label: "Bachelor of Tourism, Hospitality and Events — entry requirements (secondary aggregator)"
      url: https://www.bachelorsportal.com/studies/327797/tourism-hospitality-and-events.html
      publisher: Bachelorsportal (secondary aggregator of JCU entry requirements)
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-26"
    confidence: low
    notes: >
      Australian admission does not use the SAT/ACT; entry is based on the ATAR (Australian Tertiary
      Admission Rank), with a minimum ATAR/rank of 59.4 for this program per multiple secondary
      aggregators (not confirmed against JCU's own course page in this pass, which returned an access
      error). An ATAR is already expressed as a percentile rank by definition (see griffith.yaml's
      satActEquivalent note and UAC's official "ATAR Essentials" guide,
      uac.edu.au/assets/documents/atar-essentials.pdf), so this project records it directly as the
      percentile value, consistent with the SAT-derived percentiles used for US schools — see methodology.
      Flagged low confidence pending a primary JCU source for the underlying ATAR figure. Checked
      2026-11-03: looked for a QTAC listing or JCU's own course page to corroborate/replace this
      figure — jcu.edu.au (including the course-and-subject-handbook pages) returns HTTP 403 to
      automated fetch; no QTAC listing was found specifically for this degree (QTAC results surfaced
      only JCU's other Business-major-variant degrees); Good Universities Guide's own course-detail
      page shows ATAR as "N/A". No corroboration found either way — confidence left at low pending a
      human checking jcu.edu.au directly.

