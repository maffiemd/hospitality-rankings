  researchFundingUSD:
    value: 40346698
    unit: USD/year
    source:
      label: "Research and development income time series (1992-2024), Table 1: Summary by Category — Higher Education Research Data Collection (HERDC)"
      url: https://www.education.gov.au/research-block-grants/resources/research-income-time-series
      publisher: Department of Education, Australian Government
