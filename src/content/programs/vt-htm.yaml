  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >-
      Checked the department's own careers page (htm.pamplin.vt.edu/careers.html), which states an
      85-90% general job-placement rate for graduates (not internship-specific — see
      outcomes.employmentRate) but no internship completion/placement percentage. Also checked
      Pamplin's Class of 2023 Post-Graduation Report and the HTM undergraduate catalog entry
      (undergradcatalog.registrar.vt.edu/2122/htm.html), both of which describe the required field
      study/internship experience but report no completion or placement rate. An undated archived HTM
      announcement page separately cites a "97% job placement rate," but it is about general job
      placement (not internships specifically), carries no visible date, and could not be
      corroborated against a current report, so it was not used. No disclosed internship-specific
      placement-rate percentage found for v1.
  requiredInternshipHours:
    value: 400
    unit: hours
    source:
      label: "HTM 4964 General Information and Guidelines (department PDF, revised August 2018)"
      url: https://htm.pamplin.vt.edu/content/dam/htm_pamplin_vt_edu/forms/HTM%204964%20General%20Information%20and%20Guidelines.pdf
      publisher: "Virginia Tech — Howard Feiertag Department of Hospitality and Tourism Management"
      asOfDate: "2026-11-08"
    lastVerified: "2026-11-08"
    confidence: medium
    notes: >-
      HTM 4964 ("Field Study in HTM," 3 credits, required of all HTM students) requires 400 hours of
      supervised work experience, per the department's own official guidelines PDF and its field-study
      page (htm.pamplin.vt.edu/undergraduate/fieldstudy.html); students cannot graduate in December
      without completing all 400 hours. A separate 300-hour prerequisite of verified industry
      experience must be completed before enrolling in this course — not counted in the recorded
      value, which reflects the course's own required hours.

admissions:
  acceptanceRate:
    value: 55
    unit: "%"
    source:
      label: "Virginia Tech Common Data Set, 2025-26 cycle"
      url: https://www.collegedata.fyi/schools/virginia-tech
      publisher: CollegeData.fyi (secondary aggregator of Virginia Tech's Common Data Set)
      asOfDate: "2025-09-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      University-wide rate (31,515 admitted of 57,755 applicants). Pamplin College of Business and
      the HTM department do not publish a separate department-level acceptance rate; students are
      admitted to the university and declare/compete for the major afterward.
  satActEquivalent:
    value: 95.5
    unit: "percentile, national test-taking cohort (SAT Nationally Representative table, College Board)"
    source:
      label: "Virginia Tech Common Data Set, 2025-26 cycle"
      url: https://www.collegedata.fyi/schools/virginia-tech
      publisher: CollegeData.fyi (secondary aggregator of Virginia Tech's Common Data Set)
      asOfDate: "2025-09-01"
    lastVerified: "2026-10-26"
    confidence: low
    notes: >
      Virginia Tech's 2025-26 Common Data Set does not publish a composite SAT range; the raw composite
      used here sums the reported IPEDS section midpoints (Evidence-Based Reading & Writing 640-710, Math
      640-740) to 1365. Other secondary aggregators report composite ranges anywhere from 1210-1410 to
      1280-1450 depending on the cycle cited, so flagged low confidence. University-wide, not
      program-specific. Converted to a percentile via the College Board's official "SAT Nationally
      Representative Percentiles" table; the table lists 1360 at the 95th percentile and 1370 at the 96th,
      linearly interpolated to 95.5 for a composite of 1365 — see methodology.

academicResearch:
  facultyPubCitationIndex:
    value: 41480
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 10 of 15 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Zheng Xiang (15713 citations, 132 works); Juan Luis Nicolau (8039 citations, 310 works); Nancy G. McGehee (7188 citations, 115 works); Manisha Singal (3174 citations, 109 works); Florian Zach (2448 citations, 93 works).
