      Median of the reported 25th/75th percentile range ($45,000-$60,000) for Hospitality and Tourism
      Management graduates in the 2023-24 cohort; based on only 15 of 44 graduates (about one-third)
      reporting a salary, a small sample. Secondary sources separately cite a rounder "$55,000" figure
      for the Class of 2025 without a primary link, so flagged medium confidence pending a
      larger-sample primary figure.
  employmentRate:
    value: 89
    unit: "%"
    source:
      label: "Post-Graduation Report, 2023-24 Cohort — Pamplin College of Business (by major)"
      url: "https://fds.career.vt.edu/Salary/Details?cohort=2023-2024&college=Pamplin+College+of+Business&dispmajor=Y"
      publisher: Virginia Tech Career and Professional Development
      asOfDate: "2024-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      31 of 35 survey respondents (an 80% response rate out of 44 total 2023-24 graduates) reported
      being employed. The department's own careers page separately cites a broader historical
      "85-90% placement rate upon graduation," consistent with this figure. Other secondary sources
      claim up to 100% employment for the Class of 2025 "seeking employment," but no primary figure
      for that specific cohort was found for v1.
  recruiterReputationScore:
    value: 29.1
    unit: "0-100"
    source:
      label: "QS World University Rankings by Subject 2026 — Hospitality & Leisure Management, Employer Reputation indicator"
      url: https://www.topuniversities.com/university-subject-rankings/hospitality-leisure-management
