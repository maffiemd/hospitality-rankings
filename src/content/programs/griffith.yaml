outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: >
      No Griffith-specific or program-specific salary figure found for v1. The national QILT 2024
      Graduate Outcomes Survey reports a median full-time undergraduate salary of AUD 63,900 for the
      "Tourism, Hospitality, Personal Services, Sport and Recreation" study area, but that is an
      Australia-wide aggregate across all universities in the field, not a Griffith- or
      program-specific figure, so it is not recorded as this program's value. Left blank pending a
      Griffith-reported or QILT institution-level breakout.
      Checked 2026-11-03: griffith.edu.au (course page, fees pages, and PDF annual reports) returns
      HTTP 403 to automated fetch across the whole domain, so nothing further could be read directly
      from Griffith. The Good Universities Guide's course-detail page for this program shows no salary
      figure (fields come back blank/N/A on that page type). No additional program- or
      institution-specific salary source found this pass.
  employmentRate:
    unit: "%"
    confidence: low
    notes: >
      No figure isolated to this program was found for v1. QILT (qilt.edu.au) reports Griffith's
      "Business & Management" course-grouping outcome (73.9% employed full-time) via its interactive
      comparison tool, but that grouping is broader than International Tourism and Hotel Management
      specifically and the tool is JS-rendered and could not be queried for a narrower breakout in this
      pass. Left blank rather than recording a broader-grouping figure as this program's own.
      Checked 2026-11-03: Good Universities Guide's own course-detail page for this program shows no
      employment-rate figure (N/A); griffith.edu.au blocks automated fetch site-wide (HTTP 403). No
      additional source found beyond the QILT course-grouping figure already noted above.
  recruiterReputationScore:
    value: 47
    unit: "0-100"
    source:
      label: "QS World University Rankings by Subject 2026 — Hospitality & Leisure Management, Employer Reputation indicator"
      url: https://www.topuniversities.com/university-subject-rankings/hospitality-leisure-management
      publisher: QS Quacquarelli Symonds
      asOfDate: "2026-03-25"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table, where Griffith ranked No. 28 worldwide (overall
      score 57.5). Griffith is also ranked Australia's No. 1 and world No. 6 for Tourism and Hotel
      Management-related subjects in the Shanghai Ranking's Global Ranking of Academic Subjects,
      noted here for context only since that ranking doesn't disclose a raw, program-comparable score.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >-
      Program includes work-integrated learning/industry placement components, but no disclosed
      completion or placement-rate percentage was found for v1. Re-checked 2026-11-03 via a real
      browser session (griffith.edu.au blocks automated fetch site-wide with HTTP 403, but loads
      normally in a real browser, so this is now a confirmed absence rather than a blocked-source
      gap): the program's own page states "All students will have the opportunity to undertake a
      work-integrated learning activity in this degree program," confirming the opportunity exists
      for every student, but discloses no completion or placement-rate percentage. Left blank.
  requiredInternshipHours:
    unit: hours
    confidence: low
    notes: >-
      The degree's WIL requirement is satisfied by a Griffith Business School internship course
      (3001GBS "UG Business Internship I," or its pair 3000GBS/3018GBS) — confirmed via the degree's
      own "Degree structure" page (griffith.edu.au, requires a real browser session; blocks automated
      fetch). That course's own official course-profile page (my.griffith.edu.au/programs-courses/
      course/3001GBS) does not itself state an hours figure. Griffith Business School's "Partner with
      us" internship page (griffith.edu.au/griffith-business-school/student-opportunities/
      business-internships/partner-with-us) states internship students are available "part-time (one
      to two days per week) for approximately 12 weeks" per trimester placement — but this describes
      the 3000/3001/3018GBS course family generically, not a hard hour count tied specifically to this
      WIL requirement, and "exact placement hours and days are negotiated between students and
      industry hosts" per the same page. Left blank rather than computing a hours estimate from the
      "1-2 days/week for ~12 weeks" range, which would require assuming a specific day length not
      stated anywhere.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: >
      Not publicly disclosed. Australian undergraduate admission operates on a minimum ATAR/rank
      threshold rather than a US-style applicant-to-admit acceptance rate, and Griffith does not publish
      an acceptance-rate figure for this program.
  satActEquivalent:
    value: 63.00
    unit: "percentile, national test-taking cohort (ATAR, Australia)"
    source:
      label: "Bachelor of International Tourism and Hotel Management — entry requirements"
      url: https://www.qtac.edu.au/courses/listing/bachelor-of-international-tourism-and-hotel-management-272025/
      publisher: Queensland Tertiary Admissions Centre (QTAC)
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-26"
    confidence: medium
    notes: >
      Australian admission does not use the SAT/ACT. Entry is based on the ATAR (Australian Tertiary
      Admission Rank); the minimum ATAR/rank for this program is 63.00 per Griffith's official program
      page and QTAC, the Queensland Tertiary Admissions Centre, independently corroborated by the Good
      Universities Guide's course listing (ATAR requirement: 63, all campuses). An ATAR is already
      expressed as a percentile rank by definition — UAC's official "ATAR Essentials" guide
      (uac.edu.au/assets/documents/atar-essentials.pdf) states, for example, that an ATAR of 80.00 places a
      student in the top 20% of their age cohort — so this project records it directly as the percentile
      value, consistent with the SAT-derived percentiles used for US schools; see methodology. (Same
      approach used for jcu.yaml's satActEquivalent.)

academicResearch:
  facultyPubCitationIndex:
    value: 79438
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 33 of 34 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Susanne Becken (12584 citations, 322 works); James Higham (10038 citations, 260 works); Brent Moyle (6599 citations, 267 works); Basak Denizci Guillet (4797 citations, 129 works); Charles Arcodia (4292 citations, 204 works).
  researchFundingUSD:
    value: 83261270
    unit: USD/year
    source:
      label: "Research and development income time series (1992-2024), Table 1: Summary by Category — Higher Education Research Data Collection (HERDC)"
      url: https://www.education.gov.au/research-block-grants/resources/research-income-time-series
      publisher: Department of Education, Australian Government
      asOfDate: "2024-12-31"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      griffith.edu.au and the Dept of Education's research-block-grants PDF both block automated
      fetch, but the underlying dataset turned out to be a separate, small (1.62MB) XLSX file rather
      than the giant PDF that had been timing out; downloaded directly and parsed 2026-11-03.
      University-wide total R&D income for 2024 (all four HERDC categories — Australian Competitive
      Grants + other Public Sector Research Funding + Industry and other Funding + Cooperative
      Research Centre Funding summed): AUD 128,094,261, converted to USD at an approximate rate of
      0.65 USD/AUD (consistent with jcu.yaml) = ~US$83,261,270. Not broken out for the tourism/
      hospitality program specifically. Five-year trend from the same dataset, for context: AUD
      86.6m (2020) -> 94.4m (2021) -> 101.8m (2022) -> 115.0m (2023) -> 128.1m (2024), a steady
      upward trend. Supersedes the earlier unused news-coverage figure (futurecampus.com.au's 2025
      Queensland-universities financial roundup, ~AUD 1.22bn total revenue, not research-specific)
      previously logged here.
  hasPhDProgram:
    value: 1
    unit: boolean (1=yes, 0=no)
    source:
      label: "Griffith Institute for Tourism (GIFT)"
      url: https://www.griffith.edu.au/research/business/institute-tourism
      publisher: Griffith University
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      Griffith does not offer a standalone "PhD in Tourism" degree title; doctoral research in tourism
      and hospitality is undertaken through the university's general PhD (Business) within the Griffith
      Business School, supervised through the Griffith Institute for Tourism — Australia's largest
      tourism research institute, with 130+ academic, adjunct, and PhD members. Recorded as 1 (yes)
      since PhD-level research in this field is confirmed available, at medium confidence given it is
      not a dedicated degree title.

