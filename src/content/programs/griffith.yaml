costOfAttendance:
  totalCost:
    unit: USD/year
    confidence: low
    notes: >-
      Not yet sourced for v1. NCES/IPEDS doesn't cover non-US institutions; Griffith's own published
      international tuition + estimated living costs would need to be sourced directly. Checked
      2026-11-03: griffith.edu.au (course page, fees pages, and annual-report PDFs) returns HTTP 403
      to automated fetch across the whole domain, so Griffith's own published fee could not be read
      directly. Secondary aggregators conflict too widely to use as a substitute: TheUniGuide gives
      AUD 28,500/year, HotCoursesAbroad gives AUD 38,000/year (for the "Hotel and Hospitality" major
      variant of this same program, 2027 intake, and flagged by the source itself as "indicative —
      check with institution"), and QTAC's own listing (qtac.edu.au/courses/listing/28891/) only shows
      the domestic CSP first-year contribution (AUD 18,000), not an international fee. Study
      Australia's government course-listing pages for this program
      (search.studyaustralia.gov.au/course/bachelor-of-international-tourism-and-hotel-management/...)
      returned either an empty placeholder or a server error on every attempt, unlike the equivalent
      JCU page (see jcu.yaml) which worked cleanly, so no government-aggregator figure could be
      substituted either. The Dept of Home Affairs living-cost component (AUD 29,710/year) used for
      jcu.yaml's totalCost would apply equally here, but pairing it with an unverified, wildly
      conflicting tuition figure isn't a usable total — left blank rather than picking among them. See
      report's "please look at this yourself" list.
