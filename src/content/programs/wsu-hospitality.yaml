      label: "Higher Education Research and Development (HERD) Survey, FY 2023 — Table 23, Higher education R&D expenditures, ranked by all R&D expenditures, by R&D field"
      url: https://ncses.nsf.gov/pubs/nsf25314/assets/data-tables/tables/nsf25314-tab023.pdf
      publisher: National Center for Science and Engineering Statistics (NCSES), U.S. National Science Foundation
      asOfDate: "2023-01-01"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      University-wide total R&D expenditures (all funding sources combined — federal, state/local,
      institutional, business, nonprofit), FY2023, per NSF NCSES's Higher Education Research and
      Development (HERD) Survey, Table 23 — WSU ranked 84th of 925 reporting institutions nationally
      ($378,744,000), consistent with WSU's own public announcement of "$378 million" in FY2023 R&D
      expenditures (news.wsu.edu/news/2025/02/19/total-rd-expenditures-grow-for-third-consecutive-year/).
      NCSES's HERD survey reports R&D spending at the institution level only; it does not break
      expenditures out by individual school or department, so this is a university-wide proxy, not
      SHBM-specific.
