academicResearch:
  facultyPubCitationIndex:
    value: 86608
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 14 of 15 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Dogan Gursoy (31435 citations, 354 works); James Harbour (21019 citations, 477 works); Christina Chi (11256 citations, 74 works); Ming-Hsiang Chen (6172 citations, 157 works); Jenny Kim (5504 citations, 57 works).
  researchFundingUSD:
    value: 378744000
