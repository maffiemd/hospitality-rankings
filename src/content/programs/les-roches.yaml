  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >-
      Les Roches' bachelor curriculum includes mandatory paid internships, and the school cites roughly
      300 recruiting-company visits per year and multiple job offers per student, but no specific
      internship "placement rate" percentage is independently disclosed. Left blank. Checked 2026-11-03
      — a March 2023 Les Roches press release (hospitalitynet.org/news/4115451.html, CEO Carlos Díez de
      la Lastra) states "our job placement rate exceeds 94%" and separately "an employment placement
      rate close to 100%" — but neither figure is dated to a specific cohort, and both read as
      restatements of the overall graduate employment rate (already captured in employmentRate as 98%,
      from a different official page) rather than a distinct internship-specific placement stat, so
      using either here risked conflating two different fields with inconsistent numbers. Not used;
      left blank. Checked 2026-11-04 via sub-agent research: Les Roches' official bachelor careers page
      (brochure.lesroches.edu/bachelor/navigating-your-path-to-success) gives only the same two figures
      already rejected above (98% employed on graduation day, 94% with ≥1 offer) — no distinct
      internship-specific stat; no NECHE disclosure document exists to check (see startingSalary note);
      the Sommet Education career-index study has no internship-specific figure either; no post-2023
      press release with a differently-dated stat was found. Confirmed genuinely absent.
      Checked again 2026-11-04 (second sub-agent pass): Les Roches' Marbella/Abu Dhabi campus pages and
      its postgraduate/career-services brochure page surface additional stats ("200+ employer recruiting
      visits per semester," "2000+ open positions per semester") but still nothing internship-specific —
      only general employment/job-offer metrics already captured elsewhere. Confirmed genuinely absent,
      round 2.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: >-
      Not publicly disclosed by Les Roches. A single third-party aggregator (gotouniversity.com) cites
      approximately 90% with no verifiable link to an institutional source. Left blank rather than
      citing an unverified aggregator figure. Checked 2026-11-03 — Les Roches' "in numbers" page,
      "About," and "Quality assurance" pages disclose no acceptance/admission rate. Still left blank.
      Checked 2026-11-04 via sub-agent research: NECHE's own institutional profile for Les Roches
      (neche.org/institution/les-roches-global-hospitality-education/) lists only accreditation history
      and branch campuses (Abu Dhabi, Marbella) — no admissions data, and (per startingSalary's note)
      no Consumer Information/Student Achievement disclosure document exists for Les Roches at all.
      QS's and THE's institution profile pages (checked via Chrome, not just subject tables) have
      tuition/rankings/employability stats but no acceptance rate (THE's page is essentially an empty
      unranked stub). Confirmed Swiss federal statistics (BFS/OFS) genuinely don't apply: this program's
      institution (Les Roches Global Hospitality Education, Crans-Montana, Swiss Accreditation Council
      status) is distinct from a separately-accredited sister entity, "Les Roches-Gruyère University of
      Applied Sciences" (Bulle campus, HES-SO-recognized 2008, appears to have operated only
      2008-2016) — a different legal entity and campus, so federal higher-ed statistics don't cover the
      Crans-Montana program tracked in this file. Sommet Education has no public annual report with
      application/admission counts. Confirmed genuinely unpublished. Side note for the supervisor,
      unrelated to this field: NECHE's institutional page shows Les Roches was "Placed on Program of
      Special Monitoring" in April 2026 — not something this dataset tracks, but worth knowing.
      Checked again 2026-11-04 (second sub-agent pass): chased that NECHE monitoring action as a
      potential lead for this field, since such actions are sometimes tied to student-achievement
      findings. Resolved as a dead end — the linked document is NECHE Policy Pp 144, a generic,
      institution-agnostic policy that's automatically attached whenever any accredited institution
      undergoes a sale/change of control; it names no institution and discloses no admissions data. Also
      cross-checked Yocket (~90%) and EduRank (~90%, but computed for the distinct "Les Roches-Gruyère
      University of Applied Sciences" legal entity, not this program, and self-described as the
      aggregator's own calculation) — both rejected as unverifiable aggregator figures, same as the
      already-rejected gotouniversity.com number. FindMyOrbit and StudyFromUAE explicitly list this as
      "not publicly disclosed." Confirmed genuinely unpublished, round 2.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: >-
      Les Roches bachelor admissions are based on secondary-school transcripts (minimum ~50% academic
      achievement), English proficiency (IELTS 6.0+, no component below 5.5), and an aptitude/motivation
      assessment rather than SAT/ACT scores. No standardized test score (and so no percentile) is
      published for the admitted cohort, so left blank. Re-confirmed 2026-11-04: QS's own institution
      profile independently confirms admissions criteria are English-proficiency tests (IELTS/TOEFL/
      Duolingo/Cambridge) plus GPA, not SAT/ACT — no standardized-test percentile found anywhere. Field
      remains intentionally blank. Re-confirmed again 2026-11-04 (second sub-agent pass, alongside the
      NECHE-monitoring-lead check for acceptanceRate above): no NECHE document or admissions aggregator
      referenced any standardized-test-based index for this program either. Structurally inapplicable,
      round 2.

academicResearch:
  facultyPubCitationIndex:
    value: 21590
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 12 of 22 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Rui Pinho (8387 citations, 244 works); Matthias Schmidt (6772 citations, 264 works); Christophe Hurter (3979 citations, 322 works); Bilal Hassan (1508 citations, 80 works); Taran Patel (483 citations, 48 works).
  researchFundingUSD:
    unit: USD/year
    confidence: low
    notes: >-
      Not yet sourced for v1. Checked 2026-11-03 — no Les Roches-published research budget or funding
      figure found; its "Research" page (lesroches.edu/research-and-innovation/research/) wasn't checked
      in exhaustive depth beyond confirming no figure appeared in search results, consistent with this
      project's guidance that a reasonable, bounded search is enough for this field at small
      teaching-focused schools. Left blank. Checked 2026-11-04 via sub-agent research, following up on
      ehl.yaml's prior finding that EHL has no attributable institution-wide research-funding figure:
      Les Roches is not a registered SNSF/FNS grantee (zero matches via the live grants portal's
      institution-name filter for "Roches," "Gruyère," "Les Roches"). Unlike EHL (which is "associated"
      with HES-SO via a performance-mandate convention), Les Roches Global Hospitality Education
      (Crans-Montana) is explicitly NOT "conventionnée HES-SO" at all, so it sits outside HES-SO's
      research-funding reporting on different grounds than EHL. No public Sommet Education group annual
      report or financial statements exist; the only public filing found is a small UK subsidiary
      (Sommet Education UK Limited, ~£1.07M shareholders' funds at Companies House) — not group-wide,
      not research-relevant, no credit rating found. Switzerland's BFS/OFS R&D survey publishes only
      sector/institution-type aggregates, no Les Roches-specific line. Les Roches' own "Research" page
      (lesroches.edu/research-and-innovation/research/) was read in full this time — describes the Les
      Roches Research Committee's governance and focus areas, zero currency figures anywhere. Confirmed
      genuinely unavailable, for reasons structurally different from (even stricter than) EHL's case.
      Checked again 2026-11-04 (second sub-agent pass): CORDIS (EU Horizon Europe/2020 funded-projects
      database), searched via its dedicated organisation-name filter, returns zero results for Les
      Roches as a participant in any EU-funded research project, ever. ARAMIS (the Swiss federal
      government's official research-project database, which also indexes Innosuisse-funded projects —
      Innosuisse itself has no public per-partner project search) was searched via its Participant field
      for "Les Roches"; all 28 hits were false positives on the surname "Rochat," none the institution.
      Erasmus+'s project database also returned zero results, but this is structurally expected rather
      than informative: Switzerland hasn't been a full Erasmus+ programme country for higher education
      since 2014, so Swiss mobility funding runs through the separate, non-EU-indexed SEMP/Movetia
      scheme instead. Confirmed genuinely absent, round 2 — no further public funding database found to
      check.
