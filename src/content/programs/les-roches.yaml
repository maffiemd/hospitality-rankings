costOfAttendance:
  totalCost:
    value: 67793
    unit: USD/year
    source:
      label: "Les Roches — Crans-Montana (Switzerland) campus Bachelor's tuition & other fees schedule, international students (valid for programs starting Spring/Fall 2027)"
      url: https://sommet-education.papirfly.app/original/gallery/39472/files/original/1d9ea547-a93a-4cfb-b917-1e4dbaf02f9b.pdf
      publisher: Les Roches Global Hospitality Education
      asOfDate: "2026-11-03"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Les Roches' own current official fee schedule PDF (linked from brochure.lesroches.edu/toolkit/
      bachelor) for the Crans-Montana (Switzerland) BSc in Global Hospitality Management, international
      students. Same program shape as sister school Glion: 1 Experiential Year + 3 BSc years (4 years
      total), alternating on-campus semesters with unpaid-tuition internship semesters. Computed as:
      (CHF 183,425 "Total Compulsory Academic Expenses" [tuition + academic resources/career
      support/admin fees + health & accident insurance] + CHF 42,550 "Total Compulsory Living Expenses"
      [residential board + on-campus double room, both only charged for the on-campus semesters]) / 4
      years = CHF 56,493.75/year, converted to USD at an approximate ~1.20 USD/CHF rate (stated
      explicitly here, per this project's convention for non-USD currencies) = ~US$67,793/year.
      Excludes the one-time CHF 275 application fee, the refundable CHF 1,000 damage deposit, and
      optional extras (single-room upgrade, car parking, board upgrade) — matching this project's
      "tuition + fees + room & board" sticker-price convention. Same caveat as Glion's figure (see
      glion.yaml): this is a 4-year average across an uneven on-campus/internship schedule, not a
      single uniform "per year" sticker price the way US schools publish one. The ~US$69,570/year
      figure computed the same way for sister school Glion is a reasonable consistency check, given
      the near-identical fee structure.
