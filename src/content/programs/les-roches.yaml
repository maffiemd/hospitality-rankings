outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: >-
      No official Les Roches starting-salary disclosure was found. Only unverified third-party
      estimates exist (e.g. roughly CHF 50,000-60,000/year or approximately USD 54,000/year from
      uncredited aggregator sources), none traceable to an institutional employment report. Left blank
      rather than citing unverifiable figures. Checked 2026-11-03 — Les Roches' official "Les Roches in
      numbers" page (lesroches.edu/meet-les-roches/les-roches-key-numbers, an infographic page with
      real stat tiles — employment rate 98%, student-faculty ratio 16:1, "5 offers on graduation day,"
      etc., all read directly from the underlying image files) has no salary figure. Still left blank.
      Checked 2026-11-04 via sub-agent research: unlike EHL (also in this dataset), Les Roches has no
      NECHE "Consumer Information Disclosure" document at all — the EHL-parallel URL pattern 404s, and
      Les Roches' own scholarships page states FAFSA doesn't apply to it due to its international
      status, meaning it isn't a US Title IV participant, which plausibly explains why this document
      type doesn't exist here (EHL does participate in Title IV aid). A joint Sommet Education/DLG
      "Luxury & Hospitality Career Index" study (n=451 Glion+Les Roches grads, Oct 2026) covers career
      mobility and management-role percentages but explicitly no salary figure. No HotellerieSuisse/
      GastroSuisse survey or alumni-association report found either. Confirmed genuinely absent.
      Checked again 2026-11-04 (second sub-agent pass, fresh angles): Les Roches' Marbella and Abu Dhabi
      campus pages, a Monocle feature with its own "Les Roches in numbers" sidebar, Sommet Education's
      CSR page and foundation site, Les Roches' official LinkedIn page and posts, its Hosco recruiting
      partnership, and its alumni-network/reunion pages were all checked directly — every one traces
      back to the same employment-rate/job-offer-count cluster (94-98% employed, "5 average job offers
      per student"), never a dollar salary figure. Confirmed genuinely absent, round 2.
  employmentRate:
    value: 98
    unit: "%"
    source:
      label: "Les Roches ranked No. 2 worldwide for hospitality & leisure management in the QS 2026 rankings"
      url: https://lesroches.edu/rankings/
      publisher: Les Roches Global Hospitality Education
      asOfDate: "2026-03-26"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: '"98% of Les Roches students are employed upon graduation" and "94% have one or more job offers before completing their studies," per Les Roches'' own rankings/FAQ page. The page does not state a specific graduating cohort or survey year; asOfDate reflects the QS 2026 subject-ranking cycle the page is built around.'
  recruiterReputationScore:
    value: 94.0
    unit: "0-100"
    source:
      label: "Les Roches ranked No. 2 worldwide for hospitality & leisure management in the QS 2026 rankings"
      url: https://lesroches.edu/rankings/
      publisher: Les Roches Global Hospitality Education
      asOfDate: "2026-03-26"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table — Les Roches ranked No. 2 worldwide overall, with
      Academic Reputation reported at 91.3/100 in the same release. The figure comes from Les Roches'
      own rankings page, not an independent read of QS's raw public table (indicator-level breakdowns
