  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: Les Roches' bachelor curriculum includes mandatory paid internships, and the school cites roughly 300 recruiting-company visits per year and multiple job offers per student, but no specific internship "placement rate" percentage is independently disclosed. Left blank. Checked 2026-11-03 — a March 2023 Les Roches press release (hospitalitynet.org/news/4115451.html, CEO Carlos Díez de la Lastra) states "our job placement rate exceeds 94%" and separately "an employment placement rate close to 100%" — but neither figure is dated to a specific cohort, and both read as restatements of the overall graduate employment rate (already captured in employmentRate as 98%, from a different official page) rather than a distinct internship-specific placement stat, so using either here risked conflating two different fields with inconsistent numbers. Not used; left blank.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed by Les Roches. A single third-party aggregator (gotouniversity.com) cites approximately 90% with no verifiable link to an institutional source. Left blank rather than citing an unverified aggregator figure. Checked 2026-11-03 — Les Roches' "in numbers" page, "About," and "Quality assurance" pages disclose no acceptance/admission rate. Still left blank.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: Les Roches bachelor admissions are based on secondary-school transcripts (minimum ~50% academic achievement), English proficiency (IELTS 6.0+, no component below 5.5), and an aptitude/motivation assessment rather than SAT/ACT scores. No standardized test score (and so no percentile) is published for the admitted cohort, so left blank.

