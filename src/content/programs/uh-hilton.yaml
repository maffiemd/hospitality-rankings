      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 32 of 33 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Ki-Joon Back (7053 citations, 132 works); Juan M. Madera (5564 citations, 184 works); Minwoo Lee (3838 citations, 198 works); Priyanko Guchait (3823 citations, 98 works); Cristian Morosan (3679 citations, 78 works).
