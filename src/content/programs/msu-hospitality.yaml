    notes: >-
      Sum of cited_by_count across 64 OpenAlex-indexed works (2015-2026) affiliated with this institution and tagged with OpenAlex's "Hospitality industry" concept (id C525551149). Not filtered to current faculty or to this specific school/department — OpenAlex does not track sub-institution academic units, so a large host university's count partly reflects overall size, not just hospitality-specific output. A raw volume+impact proxy, not normalized per faculty; see methodology for the full definition and its limitations. Top journals by work count: International Journal of Hospitality Management (13 works, 332 citations); International Journal of Contemporary Hospitality Management (13 works, 276 citations); Cornell Hospitality Quarterly (6 works, 194 citations); International Journal of Hospitality & Tourism Administration (5 works, 61 citations); Journal of Hospitality & Tourism Research (4 works, 49 citations).
