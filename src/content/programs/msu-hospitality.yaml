    unit: "%"
    source:
      label: "School of Hospitality Business Undergraduate Full-Time Employment Report — Class of 2025"
      url: https://broad.msu.edu/app/uploads/2026/02/HB-Undergrad-FullTimeReport25.pdf
      publisher: "MSU Broad College of Business, School of Hospitality Business"
      asOfDate: "2025-12-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      81% of Class of 2025 graduates were employed full-time as of the report (6% continuing education,
      11% still seeking, 1% other/venture). The Class of 2024 report cited a higher 87% employed, a
      notable year-over-year difference between the two cohorts' reports.
