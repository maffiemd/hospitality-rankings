outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: >
      No SHTM-specific starting-salary figure found for v1. A PolyU SPEED (School of Professional
      Education and Executive Development) BBA (Hons) in Hospitality Management page cites an average
      starting salary of HK$16,709/month (2024), but SPEED is a separate self-financed teaching unit
      from SHTM's UGC-funded BSc scheme, so that figure is not used here to avoid misattributing it to
      SHTM. A Hong Kong Standard article on Q1 2026 graduate hiring cites a HK$20,000/month median
      starting salary for the broader "tourism" hiring category, but that is an economy-wide sector
      stat, not SHTM-program-specific, so it is also excluded. Left blank pending SHTM's own
      program-level outcomes report.
  employmentRate:
    unit: "%"
    confidence: low
    notes: Not yet sourced for v1 — no SHTM-specific graduate employment rate found; PolyU's university-wide Graduate Employment Survey (GES) PDFs did not yield a readable, program-level breakout for Hotel and Tourism Management in this pass.
  recruiterReputationScore:
    unit: "0-100"
    confidence: low
    notes: >
      Not scored for v1. Noted for context only, not used as an input: SHTM is ranked No. 1 globally in
      "Hospitality and Tourism Management" by ShanghaiRanking's Global Ranking of Academic Subjects for
      multiple consecutive years, and No. 2 globally in Hospitality and Leisure Management by QS World
      University Rankings by Subject 2026. Neither ranking discloses a raw, program-comparable
