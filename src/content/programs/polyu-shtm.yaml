outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: >
      No SHTM-specific starting-salary figure found for v1. A PolyU SPEED (School of Professional
      Education and Executive Development) BBA (Hons) in Hospitality Management page cites an average
      starting salary of HK$16,709/month (2024), but SPEED is a separate self-financed teaching unit
      from SHTM's UGC-funded BSc scheme, so that figure is not used here to avoid misattributing it to
      SHTM. A Hong Kong Standard article on Q1 2026 graduate hiring cites a HK$20,000/month median
      starting salary for the broader "tourism" hiring category, but that is an economy-wide sector
      stat, not SHTM-program-specific, so it is also excluded. Left blank pending SHTM's own
      program-level outcomes report. Checked 2026-11-03: PolyU's GES2023 Survey Summary PDF (cited
      above for employmentRate) breaks salary out only by employment sector and university-wide
      ($24,017/month overall for 2023), not by school, so it doesn't fill this gap either. A
      third-party-cited "HK$19,031, School of Hotel and Tourism Management, 2022" figure (apparently
      from GES2022) could not be independently verified — that PDF exceeds this pass's fetch size
      limit — so it was not used.
  employmentRate:
    value: 99.4
    unit: "%"
    source:
      label: "Summary of Graduate Employment Survey 2023 (Degree Programmes) — First Destination by Department"
      url: https://www.polyu.edu.hk/sao/docdrive/cps/GES2023_Survey_Summary.pdf
      publisher: PolyU Student Affairs Office, Careers and Placement Section
      asOfDate: "2023-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: >
      Not directly published as a school-level rate, but computed from the SHTM row of GES2023's
      department breakdown using the survey's own stated formula. SHTM's First Destination breakdown:
      161 employed, 8 further studies, 1 unemployed, 14 other (79.5% response rate; 184 respondents
      implied). Applying "Employment Rate = Employed / (Employed + Unemployed but seeking employment)"
      — the same formula GES2023 uses for its university-wide 98.7% headline figure, with further-studies
      and other/non-seeking graduates excluded — to the SHTM-only counts gives 161 / (161 + 1) = 99.4%.
      Flagged medium confidence because this is a maintainer calculation from raw published counts rather
      than a rate PolyU itself discloses pre-computed for SHTM.
  recruiterReputationScore:
    value: 57.3
    unit: "0-100"
    source:
      label: "QS World University Rankings by Subject 2026 — Hospitality & Leisure Management, Employer Reputation indicator"
      url: https://www.topuniversities.com/university-subject-rankings/hospitality-leisure-management
      publisher: QS Quacquarelli Symonds
      asOfDate: "2026-03-25"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table, where PolyU ranked No. 15 worldwide (overall
      score 69.2) — correcting an earlier note in this file that cited "No. 2 globally" for this same
      2026 QS table, which doesn't match the live table as verified on 2026-11-02. PolyU is also
      ranked No. 1 globally in "Hospitality and Tourism Management" by ShanghaiRanking's Global
      Ranking of Academic Subjects for multiple consecutive years, noted here for context only since
      that ranking doesn't disclose a raw, program-comparable score.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >-
      Not yet sourced for v1. The BSc scheme includes a mandatory Work-Integrated Education (WIE)
      industrial placement component (SHTM's WIE page confirms all Hotel Management students
      undertake placement at Hotel ICON, local hotels, or SHTM-approved overseas hospitality
      organisations), but no disclosed placement-completion-rate percentage was found as of
      2026-11-03, including in PolyU's WIE handbook/booklet pages.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: >
      Not publicly disclosed in acceptance-rate terms. Hong Kong's JUPAS system reports first-year
      intake and offer counts rather than an applicant-to-offer acceptance rate; PolyU's JS3310 (Hotel
      and Tourism Management) JUPAS page lists a first-year intake of 74 places and Band-A offer counts
      of 75 (2024), 55 (2025), and 43 (2026), but does not publish total Band-A/B/C applicant volume
      needed to compute a comparable acceptance rate. Checked again 2026-11-03: PolyU's JS3310 SNDAS
      document is admission *requirements* for a specific direct-nomination pathway, not applicant/offer
      statistics, and the live JUPAS programme page (polyu.edu.hk/study/ug/jupas/2026/js3310) returned
      HTTP 403 to automated fetch — would need a logged-in/interactive browser session to check.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: >
      Hong Kong undergraduate admission does not use the SAT/ACT; local applicants are admitted through
      JUPAS based on a Best-5-subjects HKDSE composite score (PolyU's JS3310 lists an average admission
      score of 163.5 for 2026/27 entry). This project previously recorded that raw JUPAS score directly in
      this field, but it has been removed: the scoring pipeline min-max normalizes every program's raw
      value for this metric against each other (see normalize.ts), so a ~150-170-scale JUPAS score sitting
      in the same pool as SAT composites (~1000-1600) or an ATAR (0-99.95) would be compared on scale, not
      on actual selectivity. Unlike the SAT (College Board's published percentile table) and the ATAR (a
      percentile by definition), no official population-level percentile distribution for the JUPAS/HKDSE
      Best-5 composite was found after a dedicated search — HKEAA's published statistics report level
      distributions per individual subject, not a joint distribution of weighted five-subject composites,
      so building one would mean modeling an estimate rather than citing a source. Left blank rather than
      estimating one; see methodology.

academicResearch:
  facultyPubCitationIndex:
    value: 196727
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 77 of 85 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Haiyan Song (19417 citations, 349 works); Sam Kim (16887 citations, 450 works); Ying Wang (14398 citations, 797 works); Cathy Hsu (12299 citations, 303 works); Jinsoo Lee (11607 citations, 350 works). (One initial match, "Yitong Yu" -> OpenAlex author A5100633632, was removed after manual verification found that author ID is actually registered as "Yue Wang" and spans ~94 unrelated institutions -- a name-disambiguation merge, not this person; see research/faculty-citations-batch-c.yaml for detail.)
