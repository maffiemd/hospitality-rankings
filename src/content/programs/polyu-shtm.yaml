costOfAttendance:
  totalCost:
    value: 42343
    unit: USD/year
    source:
      label: "PolyU — Undergraduate Fees and Scholarships (non-local student tuition and expenses)"
      url: https://polyu.edu.hk/study/ug/fees-and-scholarships/fees-ug
      publisher: The Hong Kong Polytechnic University
      asOfDate: "2026-01-01"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      PolyU's own published total for non-local students — tuition (HK$240,000) + university-managed
      accommodation (HK$18,515, first-year only; 2026/27 rate) + basic campus meal charges (HK$53,040)
      + personal expenses (HK$18,717) — summing to HK$330,272/year, which the page itself converts to
      "~USD42,343." Not all components are tied to the same stated year (only the accommodation figure
      explicitly says 2026/27), and from year two students must arrange their own housing off-campus,
      so actual cost may differ after year one.
