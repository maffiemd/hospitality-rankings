    unit: boolean (1=yes, 0=no)
    source:
      label: "Doctor of Philosophy in Hotel and Tourism Management — Entrance Requirements and Application Documents"
      url: https://www.polyu.edu.hk/shtm/study/research-postgraduate-programme/doctor-of-philosophy-in-hotel-and-tourism-management/entrance-requirements-and-application-documents/
      publisher: PolyU School of Hotel and Tourism Management
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-05"
    confidence: high
    notes: SHTM's own site confirms both a PhD and a Doctor of Hotel and Tourism Management (D.HTM) research-postgraduate program; SHTM is widely regarded as having one of the field's largest and most research-active doctoral cohorts.

academicQuality:
  sixYearGraduationRate:
    unit: "%"
    confidence: low
    notes: >-
      Not yet sourced for v1. Checked 2026-11-03: Hong Kong's UGC doesn't appear to publish a
      cohort-based graduation/completion rate the way IPEDS does for US institutions — UGC's
      data.gov.hk datasets give annual graduate and first-year-enrollment headcounts by institution,
      not matched cohort tracking, so a rate can't be computed from them without assuming a cohort
      correspondence the data doesn't actually establish. No PolyU-published institutional graduation
      rate was found either.
  retentionRate:
    unit: "%"
    confidence: low
    notes: >-
      Not yet sourced for v1. Checked 2026-11-03, same search as sixYearGraduationRate above — no
      UGC or PolyU-published first-to-second-year retention rate was found.
