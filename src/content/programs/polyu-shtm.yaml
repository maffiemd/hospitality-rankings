admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: >
      Not publicly disclosed in acceptance-rate terms. Hong Kong's JUPAS system reports first-year
      intake and offer counts rather than an applicant-to-offer acceptance rate; PolyU's JS3310 (Hotel
      and Tourism Management) JUPAS page lists a first-year intake of 74 places and Band-A offer counts
      of 75 (2024), 55 (2025), and 43 (2026), but does not publish total Band-A/B/C applicant volume
      needed to compute a comparable acceptance rate.
  satActEquivalent:
    unit: SAT-equivalent composite
    confidence: low
    notes: >
      Hong Kong undergraduate admission does not use the SAT/ACT; local applicants are admitted through
      JUPAS based on HKDSE (Hong Kong Diploma of Secondary Education) subject-level scores aggregated
      into a JUPAS composite admission score, with non-local/international applicants assessed via their
      own qualifications (A-Levels, IB, etc.) on a case-by-case basis. PolyU's JUPAS page for JS3310 did
      not disclose a specific median HKDSE admission-score threshold in this pass, and no false
      SAT-equivalent conversion is recorded here per project convention.

