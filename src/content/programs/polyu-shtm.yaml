      url: https://www.polyu.edu.hk/shtm/docdrive/shtmupdate/v27i3/news/news_jul_vol27_1b.html
      publisher: PolyU School of Hotel and Tourism Management
      asOfDate: "2026-07-01"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      A secondary source (the School's own newsletter, not an official annual report or RGC's own
      database): "14 SHTM projects will be funded in 2026/27 to a total of HK$7.7 million" under the
      Research Grants Council's General Research Fund and Early Career Scheme. Converted at the
      HKD/USD peg (~7.80) to ~US$987,000. This covers GRF+ECS competitive grants only, not the
      School's total research funding (which would also include UGC block-grant allocations,
      industry/consultancy funding, and other RGC schemes), and the newsletter describes these as
      awards "to be funded" in 2026/27, not funds already disbursed.
  hasPhDProgram:
