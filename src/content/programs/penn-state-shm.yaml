    source:
      label: "Gainful Employment earnings-test data, CIP 52.09 Hospitality Administration/Management, Bachelor's (institution-level extract)"
      url: https://www.theheagroup.com/blog/earnings-test-data
      publisher: "The HEA Group, from U.S. Department of Education Gainful Employment (OBBBA) earnings-test data"
      asOfDate: "2024-01-01"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      Not a starting-salary figure like most other schools in this dataset — this is median earnings
      four years after completion for Penn State's Hospitality Administration/Management bachelor's
      completers (pooled 2017-18/2018-19 completer cohorts, earnings measured in CY2022-CY2023,
      inflation-adjusted to 2024 dollars), from the federal Gainful Employment earnings test, via The
      HEA Group's compiled extract. Used here because no primary starting-salary figure for this
      program was otherwise available (SHM's own page cites only a ">$50k for three-quarters of
      grads" threshold, not an average) — treat as a different metric vintage/definition than schools
      with a self-reported starting-salary figure, not a directly comparable number.
