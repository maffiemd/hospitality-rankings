      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 14 of 19 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Anna S. Mattila (27897 citations, 480 works); Seoki Lee (9727 citations, 206 works); Michael J. Tews (3587 citations, 95 works); John O'Neill (3369 citations, 99 works); Breffni Noone (2056 citations, 63 works).
