  satActEquivalent:
    value: 99
    unit: "percentile, national test-taking cohort (SAT Nationally Representative table, College Board)"
    source:
      label: "Cornell University Common Data Set 2025-26"
      url: https://irp.cornell.edu/wp-content/uploads/2026/09/Cornell-Common-Data-Set-2025-26.pdf
      publisher: Cornell Institutional Research and Planning
      asOfDate: "2025-09-01"
    lastVerified: "2026-10-26"
    confidence: low
    notes: Raw SAT composite was the midpoint of the university-wide SAT middle-50% range (1490-1550) for the entering class covered by the 2025-26 CDS; not SHA-specific, since Cornell does not publish per-college test score ranges. Converted to a percentile via the College Board's official "SAT Nationally Representative Percentiles" table (research.collegeboard.org/reports/sat-suite/understanding-scores/sat), which reports composite scores of 1510+ as "99+"; recorded as 99, the table's effective ceiling. This project compares admissions selectivity across all programs on a common percentile-of-national-cohort scale rather than mixing raw score systems (SAT points, ATAR, UCAS Tariff, etc.) — see methodology.

academicResearch:
  facultyPubCitationIndex:
    value: 128267
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 62 of 71 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Lei Yu (43807 citations, 571 works); Andrew Whitmore (14165 citations, 245 works); Tony Simons (8422 citations, 92 works); Bruce Tracey (6311 citations, 120 works); Ceridwyn King (6180 citations, 115 works).
