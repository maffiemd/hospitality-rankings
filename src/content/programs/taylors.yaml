      specific cohort. General DOSM/market benchmarks for Malaysian fresh-graduate pay exist (roughly
      RM2,800-3,200/month) but are not field-specific, let alone culinary/hospitality- or
      Taylor's-specific, so not usable here. Checked 2026-11-04 via sub-agent research covering further
      angles: Taylor's Career Planning and Internships / Career Services Centre pages, the School of
      Hospitality, Tourism and Events (SHTE) landing page, QS Stars and QS Graduate Employability
