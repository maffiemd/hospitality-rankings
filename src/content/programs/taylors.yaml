academicQuality:
  sixYearGraduationRate:
    unit: "%"
    confidence: low
    notes: >-
      Checked per task instruction — no graduation-rate figure found for Taylor's University, Malaysia
      (this program's parent institution). Search results are dominated by an unrelated US institution
      of a similar name, Taylor University in Upland, Indiana (which does publish a roughly 74-77%
      six-year graduation rate via Data USA/College Factual/IPEDS) — explicitly a different school, not
      used. IPEDS/NCES doesn't cover Malaysian institutions, and no Malaysian-government or Taylor's-own
      equivalent disclosure was found. Not yet sourced for v1. Checked 2026-11-04 via sub-agent
      research: Malaysia's SETARA institutional rating gives Taylor's "Tier 5: Excellent" across its
      2009/2011/2013/2017 audits, and MQA's discipline-level D-SETARA rated Taylor's Hospitality,
      Tourism & Culinary Arts school "Tier 6: Outstanding" in 2012 (the only institution to receive it
      that year) — but both SETARA and D-SETARA publish categorical tiers, not graduation-rate
      percentages, so neither is usable for this field. QS Stars (5-star, Taylor's current rating) has
      no retention/completion component. No additional MOHE tracer-study table beyond the
      already-checked one reports a completion percentage. Confirmed genuinely absent.
  retentionRate:
    unit: "%"
    confidence: low
    notes: >-
      Checked per task instruction — same result as sixYearGraduationRate: no retention-rate figure
      for Taylor's University, Malaysia; search results again surfaced the unrelated Taylor University
      (Upland, Indiana — roughly 89-91% first-to-second-year retention per Data USA and its own press
      release), a different institution, not used. No Malaysian equivalent found. Not yet sourced for
      v1. Checked 2026-11-04 via sub-agent research against the same new sources checked for
      sixYearGraduationRate above (SETARA/D-SETARA tiers, QS Stars categories, the MOHE tracer study) —
      same result: no numeric retention figure found anywhere. Confirmed genuinely absent.
