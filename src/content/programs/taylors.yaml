      Graduate Tracer Study (SKPG) chapter directly
      (https://mohe.gov.my/en/download/statistics/2025-1-1/1845-bab-7-skpg-2025-pdf/file, Table 7.3,
      "Number and Percentage of Malaysian Graduates based on Graduate Employment by Field of Studies,
