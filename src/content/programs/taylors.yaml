    unit: USD/year
    confidence: low
    notes: >-
      Still not sourced for v1. Re-checked Taylor's own program page — no RM/USD starting-salary
      figure anywhere on it. Also read the actual 2025 MOHE "Statistik Pendidikan Tinggi" publication's
      Graduate Tracer Study (SKPG) chapter directly
      (https://mohe.gov.my/en/download/statistics/2025-1-1/1845-bab-7-skpg-2025-pdf/file, Table 7.3,
      "Number and Percentage of Malaysian Graduates based on Graduate Employment by Field of Studies,
      2025") — it gives national employment/unemployment counts by broad field (hospitality/culinary
      would fall under its aggregate "Services" category, 15,130 graduates, 90.2% employed — not
