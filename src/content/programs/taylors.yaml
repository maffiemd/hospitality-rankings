      sub-agent research using Claude in Chrome (a real browser session), which resolves the earlier
      "JS-rendered, blocked by fetch" hypothesis: THE's Taylor's University page
      (timeshighereducation.com/world-university-rankings/taylors-university-sdn-bhd) is a sparse,
      unclaimed/unranked listing ("Do you work for this institution? Make your university stand out by
