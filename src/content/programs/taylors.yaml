      ranking-indicator score, not a raw students-per-faculty count, so it isn't the same unit as this
      project's other facultyStudentRatio entries and wasn't used. Instead, used the SAME page's raw
      "Students & Staff" panel figures: 8,669 total students / 869 total faculty staff = 8,669/869 ≈
      9.98, rounded to 10.0. A first automated element read of these raw counts was knocked off before
      independent confirmation by the page's aggressive ad-driven redirects; re-verified 2026-11-04 in
      a second, cleaner pass (navigate, immediate get_page_text with no clicks, then a non-interactive
      accessibility-tree `find` read of the still-collapsed Students & Staff accordion, confirmed via
      screenshot that nothing was expanded/clicked) — both passes returned the identical 8,669/869
      figures independently. No explicit year is attached to the Students & Staff counts themselves;
      the surrounding page blends ranking cycles (QS World University Rankings 2027 context, with
      prose citing 2025 and 2024 QS editions elsewhere), so this is treated as a current-page-live
      snapshot rather than a dated as-of figure — kept at medium rather than high confidence for that
      reason, consistent with this field's confidence level for other schools sourced from a rankings
      profile page.
