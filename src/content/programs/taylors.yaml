  researchFundingUSD:
    unit: USD/year
    confidence: low
    notes: >-
      Checked Taylor's own "Research and Enterprise" page
      (https://university.taylors.edu.my/en/research-and-enterprise.html) directly — it states several
      different RM figures, all university-wide (not Taylor's Culinary Institute-specific and not
      broken out by school): "over RM130 million into research and enterprise" as a forward-looking
      5-year investment plan (no base year given); "more than RM8.5 million in external research funds
      won" (no date/period attached to this headline figure); "over RM24 million" in external research
      grants, cumulative 2017-2025; MYR 699,918.00 in FRGS and PRGS for the year 2025; MYR 997,798.00 in
      FRGS alone for the year 2024. None of these is specific to the Culinary Institute, hospitality, or
      this program, and they aren't even mutually consistent as a single "total annual research
      funding" figure (different grant schemes, different time windows). Using any of them here would
      misattribute a university-wide number — almost certainly dominated by Taylor's much larger
      engineering/business/science faculties — to this undergraduate culinary program, so none was
      used. Not yet sourced for v1. Checked 2026-11-04 via sub-agent research for a single clean annual
      total, following this project's convention of using a university-wide total when flagged as such
      (as with griffith.yaml, jcu.yaml, surrey-htm.yaml): Taylor's is privately held (the Loy family;
      no Bursa Malaysia listing, no IPO, no sukuk/bond rating found in MARC/RAM searches), so no
      audited financial statements are publicly available to pull a research-expenditure line from.
      Malaysia's MASTIC National Survey of R&D (the HERD/HERDC equivalent) covers Higher Learning
      Institutions only as a sector aggregate across all editions found (2012/2016/2019/2021), never
      broken out by named institution. THE's World University Rankings profile for Taylor's has no
      filled-in "Key stats" at all (research income, total income, student/staff counts all blank —
      genuinely unpublished, not a fetch-blocking issue) and THE Impact Rankings surfaced nothing
      Taylor's-specific either. MyRA (Malaysia's research-assessment instrument) rated Taylor's in 2011
      but outputs only a star tier, not a dollar figure. No genuine annual total-research-income figure
      exists anywhere public for this institution.
