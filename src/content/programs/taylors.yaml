      this program, and they aren't even mutually consistent as a single "total annual research
      funding" figure (different grant schemes, different time windows). Using any of them here would
      misattribute a university-wide number — almost certainly dominated by Taylor's much larger
      engineering/business/science faculties — to this undergraduate culinary program, so none was
      used. Not yet sourced for v1.
