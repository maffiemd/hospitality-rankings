costOfAttendance:
  totalCost:
    value: 13119
    unit: USD/year
    source:
      label: "Bachelor of Culinary Management (Honours) program page — Programme Information for 2026 (Fees)"
      url: https://university.taylors.edu.my/en/study/explore-all-programmes/taylors-culinary-institute/undergraduate/bachelor-of-culinary-management.html
      publisher: Taylor's University
      asOfDate: "2026-01-01"
    lastVerified: "2026-11-03"
    confidence: low
    notes: >-
      Taylor's own program page lists "Fees: USD 39,356 (International)" alongside "Duration: 3-year"
      under "Programme Information for 2026," with no explicit "total" or "per year" label next to
      either figure. Treated here as the TOTAL 3-year international-student programme fee (tuition
      only — the page gives no room & board or other living-cost breakdown), based on close agreement
      with several independent third-party aggregators describing the parallel local-rate figure's
      3-year total in the MYR 105,000-119,000 range (UniEnrol: ~MYR 113,210 including a registration
      fee; EduAdvisor: MYR 111,396; an Education Malaysia / Taylor's x NAMA Foundation scholarship
      page: MYR 105,348 pre-scholarship tuition) — consistent with fees "reviewed annually" rising
      from those slightly older figures to this 2026 schedule. Divided by 3 for a per-year figure:
      USD 13,119/year. Used the INTERNATIONAL rate rather than the page's parallel "MYR 119,246
      (Local)" figure (≈USD 8,745/year at ~0.22 USD/MYR), to stay consistent with every other non-US
      program in this dataset (PolyU, Glion, Les Roches), which are all recorded at their
      international/non-local tuition rate — the rate actually relevant to a prospective student using
      this tool, since this project's "in-state" convention for US public schools addresses the
      US-specific in-state/out-of-state distinction (see methodology.astro's cost-of-attendance
      section) and was never meant to extend to "home-country-citizen" rates for schools outside the
      US, where that rate wouldn't be available to the vast majority of this tool's prospective
      readers anyway. Does not include accommodation, food, or other living costs (no breakdown found
      on Taylor's site, unlike e.g. PolyU's page, which provided one) — likely
      understates true total cost of attendance. Flagged low confidence both for that reason and
      because the total-vs-per-year reading, while well corroborated by independent third parties, is
      an inference rather than an explicit label on Taylor's own page.
