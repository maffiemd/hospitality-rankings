      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 12 of 31 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Soo Yee Lee (797 citations, 35 works); Elise Line Mognard (412 citations, 50 works); Salini Rajendran (277 citations, 41 works); Stephanie Teoh (180 citations, 33 works); Lim Pek Kui (89 citations, 4 works).
  researchFundingUSD:
    unit: USD/year
    confidence: low
    notes: >-
      Checked Taylor's own "Research and Enterprise" page
      (https://university.taylors.edu.my/en/research-and-enterprise.html) directly — it states several
      different RM figures, all university-wide (not Taylor's Culinary Institute-specific and not
      broken out by school): "over RM130 million into research and enterprise" as a forward-looking
      5-year investment plan (no base year given); "more than RM8.5 million in external research funds
      won" (no date/period attached to this headline figure); "over RM24 million" in external research
      grants, cumulative 2017-2025; MYR 699,918.00 in FRGS and PRGS for the year 2025; MYR 997,798.00 in
