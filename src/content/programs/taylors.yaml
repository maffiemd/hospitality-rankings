      in the chapter (no RM amount, no "gaji"/"pendapatan" table). So the same tracer-study source
      material already cited for employmentRate has no companion salary figure for this or any
      specific cohort. General DOSM/market benchmarks for Malaysian fresh-graduate pay exist (roughly
      RM2,800-3,200/month) but are not field-specific, let alone culinary/hospitality- or
      Taylor's-specific, so not usable here.
