    unit: hours
    source:
      label: "Malaysian Qualifications Register — Bachelor of Culinary Management (Honours), reference A9387"
      url: https://www.mqa.gov.my/mqr/english/epapar.cfm?NoRujA=A9387&IdAkrKP=5732
      publisher: Malaysian Qualifications Agency (MQA)
      asOfDate: "2026-11-09"
    lastVerified: "2026-11-09"
    confidence: low
    notes: >-
      This is Malaysia's national qualifications-accreditation register, not a Taylor's marketing
      page or an aggregator — it resolves the inconsistency found across Taylor's own pages (10 weeks /
      3 months / 6 months). For the current curriculum (cohorts starting 04/01/2023 onward), the
      register's duration table lists "Industrial Training: 24 (weeks) / 1 (semester)," independently
      confirmed via two separate live reads of the register page, including a direct re-check on
      2026-11-09. The register states weeks, not hours; the recorded value converts this to hours
      assuming a standard 40-hour work week (24 x 40 = 960), stated explicitly as an assumption rather
      than an MQA-stated figure, so as to be comparable with other programs' hour-denominated values —
      flagged low confidence for that reason, lower than the medium confidence given to programs where
      an hours figure is directly stated by the institution itself.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: >-
      Not publicly disclosed. As a private Malaysian university, Taylor's does not publish a US-style
      applicant-to-admit acceptance rate for this program. Re-checked per task instruction: third-party
      aggregators (Collegedunia, HotCoursesAbroad, EduRank) give rough estimates in the 60-75% range,
      but each explicitly describes its own number as a circumstantial/calculated estimate, not an
      official Taylor's figure, so none is usable here. Confirms the existing note. Checked 2026-11-04
      via sub-agent research, this time against INSTITUTION profile pages rather than subject tables:
      QS's topuniversities.com/universities/taylors-university profile shows only rank, programme
      count, and international-student share — no acceptance rate, only entry-requirement minimums;
      THE's timeshighereducation.com Taylor's profile has no admissions stats at all ("There is no
      further information for students at this time"); Bachelorsportal's institution page and its exact
      program match (bachelorsportal.com/studies/327600/culinary-management.html) list only tuition,
      deadlines, and requirements; Taylor's own "About Taylor's" page has no facts-and-figures section.
      Genuinely unpublished by any primary or ranking-body source — no edit warranted.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: >
      Malaysian admission does not use the SAT/ACT. Local entry is via Taylor's own Foundation/Diploma
      pathway (min. CGPA 2.00), STPM (min. CC, CGPA 2.00), or UEC (min. 5 B's); other accepted
      qualifications include A-Levels (min. DD), IB (min. 24 points), and — for applicants holding it —
      ATAR (min. 55). Intake is heterogeneous across these pathways with no single standardized score, so
      no percentile conversion is recorded here per project convention. Re-confirmed 2026-11-04 as a
      deliberate exclusion, not a gap: QS's university-wide admission minimums separately list "ATAR
      65+" as a general floor, distinct in scope from this program's own ATAR 55 minimum — neither is a
      percentile conversion and neither resolves the underlying multi-pathway heterogeneity, so this
      field remains intentionally blank.
    source:
      label: "Bachelor of Culinary Management (Honours) — Entry Requirements"
      url: https://university.taylors.edu.my/en/study/explore-all-programmes/taylors-culinary-institute/undergraduate/bachelor-of-culinary-management.html
      publisher: Taylor's University
      asOfDate: "2025-01-01"

