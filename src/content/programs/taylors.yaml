    notes: >
      Malaysian admission does not use the SAT/ACT. Local entry is via Taylor's own Foundation/Diploma
      pathway (min. CGPA 2.00), STPM (min. CC, CGPA 2.00), or UEC (min. 5 B's); other accepted
      qualifications include A-Levels (min. DD), IB (min. 24 points), and — for applicants holding it —
      ATAR (min. 55). No SAT-equivalent conversion is recorded here per project convention.
