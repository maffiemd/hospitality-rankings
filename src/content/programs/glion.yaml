academicQuality:
  sixYearGraduationRate:
    value: 77
    unit: "%"
    source:
      label: "Glion in Figures — \"Bachelor graduation rates\" chart (2019-2024)"
      url: https://www.glion.edu/glion-in-figures/
      publisher: Glion Institute of Higher Education
      asOfDate: "2024-01-01"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Glion's own published "Bachelor graduation rates" chart on its "Glion in Figures" page gives a
      bachelor graduation rate by year from 2019-2024: 76%, 80%, 79%, 72%, 73%, 77%. Used the most
      recent year (2024: 77%). Important caveat: this is Glion's own disclosed metric, not confirmed
      to be the US IPEDS "150% of normal time" (6-year) cohort-completion rate this schema field is
      modeled on — Glion's bachelor program is nominally a 1-year Experiential Year + 3-year BSc (4
      years total, not the 4-year-normal-time US baseline IPEDS assumes), and the chart's methodology
      (which entering cohort each year's bar tracks, and over what window) isn't stated. Filled anyway
      since it's real, current, official per-cohort data directly on point for "graduation rate," with
      this mismatch flagged per this project's precedent for institution-reported proxies (e.g. the
      QS-based recruiterReputationScore above). The chart's data was only extractable by downloading
      the underlying chart image directly (wp-headless.elca-cloud.com/glion/.../Graduation_rates_
      bachelor_2019-2024.png) and reading it visually — the page's text itself has no readable figures,
      only images.
  retentionRate:
    value: 89
    unit: "%"
    source:
      label: "Glion in Figures — \"Bachelor retention rates\" chart (2019-2024)"
      url: https://www.glion.edu/glion-in-figures/
      publisher: Glion Institute of Higher Education
      asOfDate: "2024-01-01"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Glion's own published "Bachelor retention rates" chart on its "Glion in Figures" page gives two
      series per entering-cohort year, 2019-2024: "% returning year 2" (95%, 91%, 93%, 94%, 96%, 89%)
      and "% returning year 3" (95%, 93%, 97%, 96%, 96%, 90%). Used the most recent cohort's "%
      returning year 2" figure (2024: 89%) as the closer match to this schema field's first-to-second-
      year retention definition (see schema.ts comment); "% returning year 3" was not used. Same
      image-only-chart caveat as sixYearGraduationRate above (downloaded Retention_rates_bachelor_
      2019-2024.png directly from wp-headless.elca-cloud.com to read it) and same methodology caveat
      (cohort-tracking window not stated by Glion). The chart's first x-axis label renders as
      "2019.2," which looks like a rendering artifact for "2019," not a separate data point.
