outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: No official Glion starting-salary disclosure was found. Only crowd-sourced aggregator data (Glassdoor, Emolument) exists, with large unexplained variance by role and degree classification (e.g. a BSc sample of $40,000/year vs. a "Bachelor (Other)" sample of $112,000/year from the same aggregator) — too inconsistent to treat as a reliable figure. Left blank. Checked 2026-11-03 — Glion's official "About Us," "Glion in Figures" (glion.edu/glion-in-figures/, an infographic page with several real cohort-data charts — see sixYearGraduationRate/retentionRate below), and careers pages were all read directly; none states a salary figure. Still left blank.
  employmentRate:
    value: 98
    unit: "%"
    source:
      label: "About Us — Glion"
      url: https://www.glion.edu/about-us/
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: '"98% of job-seeking students have one or more job offers upon graduation" per Glion''s own site. This is a job-offer rate at graduation, not a post-graduation employment survey result like EHL''s, and Glion''s page does not state a specific graduating cohort or survey year — the figure is treated as current as of the QS 2026 rankings cycle referenced on the same page.'
  recruiterReputationScore:
    value: 93.5
    unit: "0-100"
    source:
      label: "Glion ranked No. 3 worldwide in QS 2026"
      url: https://www.glion.edu/ranking/
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-03-26"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table — Glion ranked No. 3 worldwide overall and also
      No. 3 worldwide specifically on this indicator, with Academic Reputation reported at 89.9/100 in
      the same release. The figure comes from Glion's own rankings page, not an independent read of
      QS's raw public table (indicator-level breakdowns were not otherwise accessible), so treat this
      as institution-reported rather than primary-verified. Still a provisional proxy per this
      project's schema: it reflects aggregate employer-survey sentiment toward the institution's
      subject area, not a direct measure of this specific program's recruiter relationships.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: Glion's bachelor curriculum includes two mandatory 6-month paid internships, and the school cites an average of multiple internship offers per student per semester, but no specific internship "placement rate" percentage is disclosed. Left blank rather than inferring one from curriculum structure. Checked 2026-11-03 — Glion's "Glion in Figures" page (glion.edu/glion-in-figures/) has real charts for "Students on internship per industry sector" and "per region," and a chart of total students-plus-internship headcount by year (2024 figure 1,633) — all headcounts/distributions, not a placement-rate percentage. Still left blank.
  requiredInternshipHours:
    value: 1920
    unit: hours
    source:
      label: "Bachelor's in International Hospitality Business — program structure page"
      url: https://brochure.glion.edu/bachelors-programs/bachelors-in-international-hospitality-business
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-11-09"
    lastVerified: "2026-11-09"
    confidence: medium
    notes: >-
      Glion's own program-structure page lists two internships for the full 4-year track: a "24-week
      operational internship placement" in the Experiential Year (Semester 2 — skippable for
      direct-entry students who skip the Experiential Year) and a "24-week administrative internship
      placement" inside the 3-year BSc itself (Year 2, Semester 3) — 48 weeks total. A separate,
      shorter "12-week professional work placement" in BSc Year 3 Semester 6 is explicitly NOT labeled
      an internship and is excluded from this total. Corroborated by glion.edu/bachelor-internships/
      ("Your Bachelor's degree includes two internships"). Converted to hours assuming a standard
      40-hour work week (48 weeks x 40 = 1,920), stated explicitly as an assumption since neither page
      states total hours directly. Direct-entry students who skip the Experiential Year would only
      have the one 24-week BSc-internal internship — the recorded value reflects the full 4-year track
      this project's costOfAttendance figure is also based on.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed by Glion. A single third-party aggregator (gotouniversity.com) cites 85% with no verifiable link to an institutional source. Left blank rather than citing an unverified aggregator figure. Checked 2026-11-03 — Glion's "About Us" and "Glion in Figures" pages (which do disclose other real cohort data — see sixYearGraduationRate/retentionRate below) have no admissions/acceptance chart. Still left blank.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: Glion's bachelor admissions are holistic rather than SAT/ACT-based — direct entry requires a vocational baccalaureate or a secondary diploma plus relevant work experience, assessed alongside motivation and an English-proficiency threshold (IELTS 5.5+). No standardized test score (and so no percentile) is published for the admitted cohort, so left blank.

