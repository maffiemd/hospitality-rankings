outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: No official Glion starting-salary disclosure was found. Only crowd-sourced aggregator data (Glassdoor, Emolument) exists, with large unexplained variance by role and degree classification (e.g. a BSc sample of $40,000/year vs. a "Bachelor (Other)" sample of $112,000/year from the same aggregator) — too inconsistent to treat as a reliable figure. Left blank.
  employmentRate:
    value: 98
    unit: "%"
    source:
      label: "About Us — Glion"
      url: https://www.glion.edu/about-us/
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: '"98% of job-seeking students have one or more job offers upon graduation" per Glion''s own site. This is a job-offer rate at graduation, not a post-graduation employment survey result like EHL''s, and Glion''s page does not state a specific graduating cohort or survey year — the figure is treated as current as of the QS 2026 rankings cycle referenced on the same page.'
  recruiterReputationScore:
    value: 93.5
    unit: "0-100"
    source:
      label: "Glion ranked No. 3 worldwide in QS 2026"
      url: https://www.glion.edu/ranking/
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-03-26"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table — Glion ranked No. 3 worldwide overall and also
      No. 3 worldwide specifically on this indicator, with Academic Reputation reported at 89.9/100 in
      the same release. The figure comes from Glion's own rankings page, not an independent read of
      QS's raw public table (indicator-level breakdowns were not otherwise accessible), so treat this
      as institution-reported rather than primary-verified. Still a provisional proxy per this
      project's schema: it reflects aggregate employer-survey sentiment toward the institution's
      subject area, not a direct measure of this specific program's recruiter relationships.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: Glion's bachelor curriculum includes two mandatory 6-month paid internships, and the school cites an average of multiple internship offers per student per semester, but no specific internship "placement rate" percentage is disclosed. Left blank rather than inferring one from curriculum structure.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed by Glion. A single third-party aggregator (gotouniversity.com) cites 85% with no verifiable link to an institutional source. Left blank rather than citing an unverified aggregator figure.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: Glion's bachelor admissions are holistic rather than SAT/ACT-based — direct entry requires a vocational baccalaureate or a secondary diploma plus relevant work experience, assessed alongside motivation and an English-proficiency threshold (IELTS 5.5+). No standardized test score (and so no percentile) is published for the admitted cohort, so left blank.

academicResearch:
  facultyPubCitationIndex:
    value: 38103
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 15 of 44 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Glenn Carroll (19734 citations, 318 works); Michael Macdonald (8973 citations, 178 works); Tiago Ferreira (6838 citations, 605 works); Patrick Abi Nader (1632 citations, 42 works); Michelle Wells (231 citations, 10 works).
