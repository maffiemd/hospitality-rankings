costOfAttendance:
  totalCost:
    value: 69570
    unit: USD/year
    source:
      label: "Glion — Switzerland campus Bachelor's tuition & other fees schedule (valid for students starting Spring/Fall 2027)"
      url: https://app.papirfly.com/original/gallery/39472/files/original/8fcdc77c-6935-48d4-a352-e2e32d2ebf2d.pdf
      publisher: Glion Institute of Higher Education
      asOfDate: "2026-11-03"
    lastVerified: "2026-11-03"
    confidence: medium
    notes: >-
      Glion's own current official fee schedule PDF (linked from glion.edu/apply-to-glion/tuition-fees/)
      for the Switzerland-campus BSc in International Hospitality Business, international students. The
      program runs 1 Experiential Year + 3 BSc years (4 years total, mixing on-campus semesters with
      unpaid-tuition internship semesters). Computed as: (CHF 190,100 "Total academic compulsory fees"
      [tuition + resources/services] + CHF 6,800 total health/accident insurance + CHF 16,100 total
      food & beverage prepaid + CHF 18,900 total lodging [double superior room, charged only for 3 of
      the 5 on-campus semesters per the schedule]) / 4 years = CHF 57,975/year, converted to USD at an
      approximate ~1.20 USD/CHF rate (stated explicitly here, per this project's convention for
      non-USD currencies) = ~US$69,570/year. Excludes the one-time CHF 275 application fee, the
      refundable CHF 1,250 damage deposit, and optional extras (single-room upgrade, car parking) —
      matching this project's "tuition + fees + room & board" sticker-price convention, not a full
      personal-expenses cost-of-living estimate. Because the program alternates paid-tuition and
      internship semesters rather than having a uniform annual rate, this is a 4-year average, not a
      single posted "per year" sticker price the way US schools publish one; treat it as broadly
      comparable to the other programs' figures but not perfectly like-for-like. Sister-school Les
      Roches's equivalent calculation (see les-roches.yaml) comes out to ~US$67,793/year using the same
      methodology and FX rate, a reasonable consistency check given the similar fee structures.
