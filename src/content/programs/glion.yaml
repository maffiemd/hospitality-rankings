    notes: No PhD or doctoral-level program was identified for Glion on its own site or in third-party doctoral-program directories; Glion's published offerings are limited to bachelor's and master's degrees. Unlike its sister Sommet Education school EHL, Glion does not appear to co-deliver a DBA or other doctorate, so recorded as "no," flagged medium confidence since this rests on absence of evidence rather than an explicit institutional statement.

