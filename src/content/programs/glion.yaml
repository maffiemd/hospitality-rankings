    source:
      label: "Glion Institute of Higher Education — PhD Portal institution listing"
      url: https://www.phdportal.com/universities/22514/glion-institute-of-higher-education.html
      publisher: PhDportal (Keystone Academic Solutions) — secondary aggregator
      asOfDate: "2026-10-05"
