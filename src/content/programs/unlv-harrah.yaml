outcomes:
  startingSalary:
    value: 56500
    unit: USD/year
    source:
      label: "Careers in Hospitality"
      url: https://www.unlv.edu/hospitality/careers
      publisher: UNLV William F. Harrah College of Hospitality
      asOfDate: "2025-01-01"
    lastVerified: "2026-10-05"
    confidence: low
    notes: >
      UNLV's own careers page cites an average starting salary range of $45K-$68K (midpoint used here);
      a Las Vegas Review-Journal piece on the local hospitality labor market separately cited a lower
      $36K-$45K range for hospitality-management starters, likely reflecting broader Las Vegas-market
      entry roles rather than this program's outcomes specifically. Flagged low confidence pending a
      primary outcomes report that reconciles the two.
  employmentRate:
    unit: "%"
    confidence: low
    notes: >-
      Checked the college's own careers page (unlv.edu/hospitality/careers) and Work Experience &
      Internships page (unlv.edu/hospitality/bbcsc/wei) — neither discloses an employment-rate
      percentage. Also checked UNLV's AY26 Alumni Pulse Survey announcement
      (unlv.edu/news/unlvtoday/unlv-alumni-pulse-survey-ay26-results-available), which lists "First
      Destination" as one of 22 surveyed concepts but publishes no results publicly (available only
      on request via survey@unlv.edu). No UNLV First Destination Survey report or
      institutional-research dashboard with a college-level employment rate was found publicly
      posted. Still not sourced for v1.
  recruiterReputationScore:
    value: 74.1
    unit: "0-100"
    source:
      label: "QS World University Rankings by Subject 2026 — Hospitality & Leisure Management, Employer Reputation indicator"
      url: https://www.topuniversities.com/university-subject-rankings/hospitality-leisure-management
      publisher: QS Quacquarelli Symonds
      asOfDate: "2026-03-25"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026
      Hospitality & Leisure Management subject table, where UNLV ranked No. 6 worldwide (overall
      score 82.9) — the highest of any US institution in this subject table. UNLV was also separately
      ranked #1 globally for Hospitality & Hotel Management by CEOWORLD Magazine, noted here for
      context only since that ranking doesn't disclose a raw, program-comparable score of its own.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: >-
      Harrah College requires 1,000 hours of work experience per student; the college's own Work
      Experience & Internships page (unlv.edu/hospitality/bbcsc/wei) and careers page
      (unlv.edu/hospitality/careers) report internship volume only (about 600 student internship
      placements per year), with no completion- or placement-rate percentage disclosed. No disclosed
      internship placement-rate percentage found for v1.
  requiredInternshipHours:
    value: 1000
    unit: hours
    source:
      label: "Work Experience Information and Forms"
      url: https://www.unlv.edu/hospitality/bbcsc/work-experience
      publisher: "University of Nevada, Las Vegas — William F. Harrah College of Hospitality"
      asOfDate: "2026-11-09"
    lastVerified: "2026-11-09"
    confidence: medium
    notes: >-
      Confirmed directly on the college's own Work Experience page: "the Harrah College of Hospitality
      requires each student to complete 1,000 hours of work experience (500 hours for second bachelor's
      degree program) in the hospitality industry." Hours completed as part of a for-credit internship
      cannot be double-counted toward this requirement, per the same page — this is a distinct
      work-experience requirement, not specifically an "internship" in course form, but serves the same
      experiential-learning purpose as other schools' internship-hour requirements in this dataset.

