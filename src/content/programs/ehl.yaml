slug: ehl
name: BSc International Hospitality Management
institution: EHL Hospitality Business School (École hôtelière de Lausanne)
country: Switzerland
region: Europe
website: https://www.ehl.edu/en
degreeName: BSc International Hospitality Management
accreditation: New England Commission of Higher Education (NECHE); Swiss federal accreditation (HES-SO)

outcomes:
  startingSalary:
    unit: USD/year
    confidence: low
    notes: No official EHL starting-salary disclosure was found. Only crowd-sourced aggregator data (Glassdoor/Emolument alumni self-reports) exists, ranging roughly $61,000-$105,000/year depending on role and degree classification, which is too inconsistent and unverifiable to cite as a figure. Left blank rather than averaging unreliable third-party data. Checked 2026-11-03 — EHL's own "Why EHL" page (ehl.edu) and EHL Group's "Key Facts" page (ehlgroup.com/en/about-ehl/media-center) were read directly — neither states a salary figure, only the existing 96%-employed-within-6-months stat. No EHL career-services salary report was found. Still left blank.
  employmentRate:
    value: 90.74
    unit: "%"
    source:
      label: "Graduate Outcomes — Bachelor of Science in International Hospitality Management (March 2024)"
      url: https://info.ehl.edu/hubfs/web-singapore/6.2.1.ii%20Graduate%20Outcomes%20of%20EHL%20Bachelor%20in%20International%20Hospitality%20Management.pdf
      publisher: EHL Hospitality Business School
      asOfDate: "2023-05-01"
    lastVerified: "2026-10-05"
    confidence: high
    notes: This is EHL's own NECHE-mandated public disclosure figure for the "active graduates" rate (employed, in a management trainee scheme, running their own business, or continuing study) among the 2022 graduating cohort, surveyed roughly 1 year after graduation. EHL's marketing pages separately advertise "96% securing jobs within 6 months," but that figure does not state a cohort year, so the dated official disclosure report was used instead as the more verifiable primary source.
  recruiterReputationScore:
    value: 100
    unit: "0-100"
    source:
      label: "EHL Group — Rankings (QS World University Rankings by Subject 2026, Hospitality & Leisure Management)"
      url: https://ehlgroup.com/en/about-ehl/rankings
      publisher: EHL Group
      asOfDate: "2026-03-26"
    lastVerified: "2026-11-02"
    confidence: medium
    notes: >-
      QS's Employer Reputation indicator score (not the composite subject rank) for the 2026 Hospitality
      & Leisure Management subject table, where EHL ranked No. 1 worldwide with a 98.3 overall score.
      EHL has self-reported a perfect 100/100 on this specific indicator across multiple consecutive QS
      editions (institution press releases cite 100 for 2022, 2025, and 2026 alike). The figure comes
      from EHL's own rankings page, not an independent read of QS's raw public table (indicator-level
      breakdowns were not otherwise accessible), so treat this as institution-reported rather than
      primary-verified. Still a provisional proxy per this project's schema: it reflects aggregate
      employer-survey sentiment toward the institution's subject area, not a direct measure of this
      specific program's recruiter relationships.
  internshipPlacementRate:
    unit: "%"
    confidence: low
    notes: EHL's bachelor curriculum includes mandatory paid internships, but no specific "placement rate" percentage is independently disclosed by the school. Left blank rather than inferring a figure from the fact that internships are a curriculum requirement. Checked 2026-11-03 — EHL's Lausanne and Passugg "careers/internships" pages (ehl.edu) describe program structure (24-week minimum windows, a ~1,500-student recruitment event) but state no placement percentage. Still left blank.

admissions:
  acceptanceRate:
    unit: "%"
    confidence: low
    notes: Not publicly disclosed by EHL. Third-party aggregators cite conflicting, unverified figures (30%, 34%, 45%, 90% have all appeared) with no traceable link to an EHL or Swiss accreditor primary source. Left blank rather than picking one of the conflicting estimates. Checked 2026-11-03 — same conflicting aggregator figures still surface (now also a "45.35%, Class of 2026" figure from findmyorbit, itself a US-style automated data pull with no EHL citation); EHL's own admissions and accreditation pages disclose no rate. Still left blank.
  satActEquivalent:
    unit: "percentile, national test-taking cohort"
    confidence: low
    notes: EHL does not publish an SAT-equivalent composite score for its admitted class. Its bachelor admission requirements list a minimum SAT of 1000+ as one of several accepted alternative qualifications (alongside ATAR 75+, IELTS 7+, TOEFL 80+, or Duolingo 130+), but this is a minimum eligibility threshold, not a cohort average, so it was not used to construct a percentile value.

academicResearch:
  facultyPubCitationIndex:
    value: 31608
    unit: "total career citations, current named faculty (OpenAlex)"
    source:
      label: "OpenAlex author records matched to this program's current faculty directory"
      url: https://openalex.org
      publisher: OpenAlex (processed by this project's pipeline — see methodology)
      asOfDate: "2026-10-22"
    lastVerified: "2026-10-22"
    confidence: medium
    notes: >-
      Sum of career cited_by_count across 36 of 139 current named faculty (sourced from the program's own official directory) matched to an OpenAlex author record by name + institution — covers ALL of each person's publications (any journal/field), not just hospitality-tagged ones, and their full career (not a fixed year window). Unmatched faculty (common names, no OpenAlex presence, etc.) are excluded from the sum, not counted as zero. Top contributors: Christophe Schmitt (9395 citations, 133 works); Ian Millar (7662 citations, 262 works); João Cabral (6831 citations, 284 works); Emmanuelle Faure (4216 citations, 21 works); Pierre Baron (789 citations, 35 works).
  researchFundingUSD:
    unit: USD/year
    confidence: low
    notes: Not yet sourced for v1. Checked 2026-11-03 — EHL Research microsite (research.ehl.edu) and EHL Group pages describe a sponsorship-funded research-institute model (40+ research associates and industry experts, several sponsored labs e.g. the Institute of Business Creativity) but disclose no budget or funding total, confirming this is a reasonable search-effort case per this project's guidance for small teaching-focused schools. Left blank.
  hasPhDProgram:
    value: 1
    unit: boolean (1=yes, 0=no)
    source:
      label: "Doctorate of Business Administration (DBA) — EHL and Drucker School of Management, Claremont Graduate University"
      url: https://gs.ehl.edu/doctorate-of-business-administration
      publisher: EHL Graduate School
      asOfDate: "2026-01-01"
    lastVerified: "2026-10-05"
    confidence: medium
    notes: EHL is not itself accredited by swissuniversities to award a standalone PhD, but it co-delivers a Doctor of Business Administration (DBA, awarded by Claremont Graduate University's Drucker School of Management) and participates in a PhD pathway via a HES-SO/University of Lausanne framework agreement and a partnership with Università della Svizzera italiana (USI). Counted as "yes" given these doctoral-level offerings, flagged medium confidence given the degree is not a traditional stand-alone PhD.

