costOfAttendance:
  totalCost:
    value: 67369
    unit: USD/year
    source:
      label: "Tuition Fees — Bachelor of Science in International Hospitality Management, September 2027 & February 2028 intakes (Version 1.9)"
      url: https://info.ehl.edu/hubfs/DL_Docs/Tuition_Fees_BOS_EN.pdf
      publisher: EHL Hospitality Business School
      asOfDate: "2026-01-01"
    lastVerified: "2026-11-04"
    confidence: low
    notes: >-
      Not yet sourced for v1. NCES/IPEDS doesn't cover non-US institutions; EHL's own published tuition
      + estimated living costs would need to be sourced directly. Sourced 2026-11-04 via sub-agent
      research, following this project's established non-US convention (tuition at the international
      rate + an official government minimum living-cost figure, summed and converted to USD). Tuition:
      EHL's own published fee schedule (Lausanne campus, international-student rate) lists CHF 24,898
      (Prep Year) / 40,045 (Year 1) / 24,352 (Year 2) / 34,507 (Year 3) — not flat per-year, varying
      substantially by year (likely due to internship semesters) — totaling CHF 123,802 across the
      4-year program; averaged here to CHF 30,950.50/year. The PDF carries a standard disclaimer
      ("non-contractual document... amounts are indicative and subject to modification"). The
      Swiss/A-HES-eligible local rate (CHF 1,400/yr) was not used, per this dataset's international-rate
      convention. Living costs: no single Swiss federal figure exists (Art. 27 LEI requires only
      "sufficient means," set cantonally) — used Canton Vaud's own Service de la population (SPOP)
      official checklist for student residence permits (dated 2019-01-01, still cited as current by a
      third-party guide updated Oct 2026): "Les moyens financiers sont réputés être suffisants lorsque
      l'étudiant... dispose d'environ CHF 2'000.-- par mois, frais de logement en plus" — i.e. ~CHF
      2,000/month deemed sufficient, EXCLUDING housing = CHF 24,000/year. Unlike the UK/Australia
      living-cost figures used elsewhere in this dataset, this Vaud figure explicitly excludes housing;
      EHL's own tuition PDF separately lists compulsory on-campus housing at CHF 5,850-8,474/semester,
      not included in this total. Total: CHF 30,950.50 + CHF 24,000 = CHF 54,950.50/year, converted to
      USD at 1.226 USD/CHF (XE.com mid-market rate, 2026-11-04) ≈ USD 67,369/year. Confidence kept at
      low because of several stacked caveats: the per-year tuition average is a simplification of an
      uneven schedule, the cantonal living-cost document is seven years old (though reportedly still
      current), housing is excluded from the living-cost half (likely understating true cost), and
      EHL's own tuition figures are explicitly labeled indicative/non-contractual.
