  retentionRate:
    unit: "%"
    confidence: low
    notes: Not yet sourced for v1. Checked 2026-11-03 — same search as sixYearGraduationRate above — no EHL-published first-to-second-year retention rate found. Left blank.
  facultyStudentRatio:
    unit: students per faculty
    confidence: low
    notes: Not yet sourced for v1 — checked EHL's own "Why EHL" and "EHL by the Numbers" pages, neither states a ratio in readable text (a marketing claim of 12:1 circulates on third-party sites but isn't confirmed on ehl.edu itself, and conflicts with headcount-derived estimates from those same sites). Checked 2026-11-03 — EHL Group's "Key Facts" page (ehlgroup.com/en/about-ehl/media-center) gives 4,000 enrolled students and "+750 Staff & Faculty members" institution-wide, but that figure conflates administrative staff with teaching faculty (unlike Glion/Les Roches's own clean "Student to faculty ratio" marketing stat), so it wasn't used to compute a ratio. Still left blank.

