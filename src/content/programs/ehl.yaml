    notes: >-
      Sum of cited_by_count across 31 OpenAlex-indexed works (2015-2026) affiliated with this institution and tagged with OpenAlex's "Hospitality industry" concept (id C525551149). Not filtered to current faculty or to this specific school/department — OpenAlex does not track sub-institution academic units, so a large host university's count partly reflects overall size, not just hospitality-specific output. A raw volume+impact proxy, not normalized per faculty; see methodology for the full definition and its limitations. Top journals by work count: International Journal of Hospitality Management (9 works, 61 citations); Journal of Hospitality & Tourism Research (3 works, 38 citations); Journal of Hospitality and Tourism Management (2 works, 136 citations); Journal of Human Resources in Hospitality & Tourism (2 works, 23 citations); Journal of Travel Research (2 works, 5 citations).
