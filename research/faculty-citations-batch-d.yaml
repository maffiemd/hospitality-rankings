  directory_note: 'EHL''s main research/faculty listing page (ehl.edu/en/research) lists people in two
    groups: ''Faculty'' and ''Visiting Faculty'' (the page''s own dynamic card/table rendering was summarized
    at ~141 and ~35 respectively by our fetch tool, but de-duplicating by name produced 139 unique regular-faculty
    names used below). We included the regular ''Faculty'' group (full professors, associate/assistant
    professors, senior lecturers, lecturers, including Practical Arts lecturers who are full-time teaching
    staff) and excluded everyone explicitly labeled ''Visiting Faculty''/''Visiting Lecturer''/''Visiting
    Professor''. No one was labeled Emeritus/Emerita. OpenAlex matching was NOT YET ATTEMPTED for this
    school -- blocked by a shared OpenAlex API rate limit (HTTP 429: ''Insufficient budget... free daily
    budget shared by everyone on your network''s IP address... resets at midnight UTC'') before any query
    for this school could be trusted; a direct curl test confirmed every author-search request was being
    rejected with HTTP 429, so results collected during the run are not reliable and are omitted.'
