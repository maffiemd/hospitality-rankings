# Industry-centrality research: current C-suite education cross-referenced
# against our 20-school dataset (data-gathering only — NOT wired into site
# scoring yet; normalization/weighting decisions deferred).
#
# Scope: current (as of 2026-10-06) CEO/President/CFO/COO at the 7 major
# publicly-traded hotel companies: Marriott, Hilton, Hyatt, IHG, Accor,
# Wyndham, Choice Hotels.
#
# Sourcing discipline: official company investor-relations/leadership bios,
# SEC EDGAR filings (DEF 14A proxies, 8-K press-release exhibits), Accor's
# AMF-filed Universal Registration Document. No LinkedIn. No secondary
# aggregator sites used as a sole source for any fact. Every "education: []"
# or missing credential reflects a genuine absence in the primary source,
# not a skipped search.
#
# Compiled by two parallel research passes on 2026-10-06; merged here.

- name: "Anthony G. Capuano"
  title: "President and Chief Executive Officer"
  company: "Marriott International"
  education:
    - institution: "Cornell University"
      credential: "Bachelor's degree, Hotel Administration"
      matchesDataset: cornell-sha
  source:
    url: "https://marriott.gcs-web.com/board-directors/anthony-capuano"
    label: "Anthony G. Capuano — official board/executive biography"
    publisher: "Marriott International Investor Relations"
    asOfDate: "2026-10-06"
  lastVerified: "2026-10-06"
  confidence: high
  notes: "Became CEO February 2021; additionally designated President in February 2023, so this is a combined President+CEO role with no separate President at Marriott. The gcs-web.com IR bio page itself repeatedly timed out on direct fetch in this session, so the exact sentence ('Capuano earned a bachelor's degree in hotel administration from Cornell University') is relied on via a verified live retrieval of that same URL rather than a manual page load; it is independently corroborated by Cornell's own institutional pages (business.cornell.edu/news/2026/03/13/marriott-ceo-named-2026-cornell-hospitality-icon and sha.cornell.edu/people/anthony-capuano), which identify him as 'Anthony (Tony) Capuano '87,' a 'proud alum of the Nolan School [of Hotel Administration].' Marriott's 2026 DEF 14A proxy statement (sec.gov/Archives/edgar/data/1048286/000114036126011590/ny20062722x771_def14a.htm) confirms his Cornell Hotel Society / Dean's Advisory Board affiliations but does not restate the degree. Clear match to our dataset: Cornell Nolan School of Hotel Administration, hospitality-specific program."

